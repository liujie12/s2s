<!DOCTYPE html>
<!--
  底部导航栏图标候选对照页（2026-08-26）

  为什么要有这一页：用户反馈「鸭圈」图标不美观。根因是三个 Tab 键里只有中键
  是矢量鸭子，左右两键仍是 emoji（🗺️ / 👤）。emoji 由系统字体渲染，字重、
  色彩、基线都不受设计 Token 控制，选中态该变主色也不会变，与旁边的矢量
  图形并排必然风格断裂。

  本页所有图形都是真 SVG 路径，与最终写进 code.js 的路径逐字相同，
  浏览器渲染结果即最终 Figma 渲染结果，因此可直接凭本页定稿。

  Material Symbols 路径取自官方 fonts.gstatic.com，viewBox 恒为 "0 -960 960 960"。
  鸭子路径取自 assets/duck-symbol-*.svg（唯一真源），本页用 JS 从同一份
  DISC_HEAD 常量派生各候选，避免手工转抄产生偏差。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>底部导航栏图标候选对照</title>
<style>
  :root {
    --brand: #0B7C8C;
    --secondary: #6B7280;
    --surface: #FFFFFF;
    --border: #E5E7EB;
    --bg: #F3F4F6;
    --text: #111827;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 40px 80px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 {
    font-size: 16px; margin: 40px 0 14px;
    padding-bottom: 8px; border-bottom: 2px solid var(--brand);
  }
  .lead { color: var(--secondary); margin: 0 0 8px; max-width: 780px; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; }

  /* 候选卡：标题 + 真实尺寸 Tab 栏 + 放大图 */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px; width: 424px;
  }
  .card.reco { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,124,140,.12); }
  .card h3 { font-size: 14px; margin: 0 0 2px; display: flex; align-items: center; gap: 8px; }
  .tag {
    font-size: 11px; font-weight: 400; color: var(--surface);
    background: var(--brand); border-radius: 4px; padding: 1px 6px;
  }
  .note { font-size: 12px; color: var(--secondary); margin: 0 0 12px; min-height: 36px; }

  /* 390×64 = 真实机身宽度下的底部导航栏 */
  .tabbar {
    width: 390px; height: 64px; display: flex;
    background: var(--surface); border-top: 1px solid var(--border);
    margin: 0 auto;
  }
  .tabbar.dim { background: #FAFAFA; }
  .cell {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 4px;
  }
  .cell span { font-size: 10px; line-height: 1; }
  .cell.on { color: var(--brand); }
  .cell.off { color: var(--secondary); }
  .cell .emoji { font-size: 20px; line-height: 24px; height: 24px; }

  /* 放大区：图标本体等比放大，用于看笔画会不会粘连 */
  .zoom {
    display: flex; align-items: flex-end; gap: 18px;
    margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--border);
  }
  .zoom figure { margin: 0; text-align: center; }
  .zoom figcaption { font-size: 11px; color: var(--secondary); margin-top: 4px; }

  svg { display: block; }
  .verdict { font-size: 12px; margin: 6px 0 0; }
  .bad { color: #B42318; }
  .ok { color: #067647; }
</style>
</head>
<body>

<h1>底部导航栏图标候选对照</h1>
<p class="lead">
  每条 Tab 栏都是 390×64 的真实尺寸，图标 24px。左侧「鸭圈」为选中态（主色 #0B7C8C），
  右侧「我的」为未选中态（#6B7280）。放大区是等比放大，用于判断 24px 下笔画是否粘连。
</p>

<h2>一、「鸭圈」左键候选</h2>
<div class="grid" id="left"></div>

<h2>二、「我的」右键：emoji 与矢量对比</h2>
<div class="grid" id="right"></div>

<h2>三、中键鸭子在 24px 下的候选</h2>
<p class="lead">
  现状走 mini 档：圆角色块 + 白盘 + 盘内镂空鸭头 + 白眼点，共四层结构挤在 24px 里。
  以下候选都不另画新形，只做层次减法，鸭头路径逐字沿用真源。
</p>
<div class="grid" id="duck"></div>

var EYE_DISC = { cx: 502.13, cy: 358.90, r: 40.83 };

/** 候选 B：鸭头铺满画板 92%，无容器 */
var HEAD_FILL = 'M 272.62 134.91 C 241.29 146.49 219.85 161.09 197.97 176.09 C 176.09 191.10 158.93 206.13 141.35 225.00 C 123.77 243.87 105.75 267.91 92.44 289.35 C 79.13 310.79 70.12 319.39 61.55 353.70 C 52.98 388.01 38.82 448.09 40.96 495.27 C 43.10 542.45 55.55 592.64 74.42 636.84 C 93.29 681.03 121.60 724.35 154.22 760.39 C 186.83 796.43 225.44 828.16 270.05 853.05 C 314.65 877.94 374.29 898.95 421.91 909.68 C 469.53 920.41 524.02 917.84 555.76 917.40 C 587.50 916.97 599.95 911.82 612.39 907.11 C 624.82 902.40 624.41 895.09 630.40 889.09 C 629.55 883.09 638.97 890.38 627.83 871.07 C 616.68 851.77 577.20 798.56 563.48 773.26 C 549.76 747.96 548.04 735.94 545.46 719.21 C 542.89 702.48 543.74 688.76 548.04 672.87 C 552.33 656.99 557.48 639.41 571.20 623.97 C 584.92 608.52 594.81 592.23 630.40 580.21 C 666.00 568.19 742.37 563.48 784.84 551.90 C 827.31 540.31 857.76 526.59 885.23 510.71 C 912.69 494.83 934.57 472.10 949.58 456.66 C 964.58 441.22 970.17 429.63 975.32 418.05 C 980.47 406.47 978.74 397.46 980.47 387.16 C 971.89 381.16 976.61 372.16 954.73 369.14 C 932.85 366.13 881.37 373.44 849.19 369.14 C 817.02 364.85 783.99 354.14 761.68 343.40 C 739.36 332.67 729.94 324.10 715.35 304.79 C 700.75 285.49 687.88 248.60 674.16 227.57 C 660.44 206.54 655.29 195.84 632.98 178.67 C 610.66 161.50 569.07 136.64 540.31 124.61 C 511.56 112.59 486.26 109.61 460.52 106.60 C 434.78 103.59 417.20 101.89 385.87 106.60 C 354.55 111.31 303.94 123.33 272.62 134.91 Z';

/**
 * 生成一个 Material Symbols 图标的 SVG 字符串。
 * @param {string} name MS 图标名，须存在于 MS 表中
 * @param {string} color 填充色（十六进制）
 * @param {number} px 目标边长
 * @returns {string} 可直接插入 DOM 的 <svg> 字符串
 */
function msIcon(name, color, px) {
  return '<svg width="' + px + '" height="' + px + '" viewBox="0 -960 960 960">'
       + '<path d="' + MS[name] + '" fill="' + color + '"/></svg>';
}

/**
 * 生成鸭子符号的 SVG 字符串。
 * @param {string} variant 候选标识：mini（现状）/ disc（去外层块）/ head（纯剪影）
 * @param {number} px 目标边长
 * @param {string} brand 主色
 * @returns {string} <svg> 字符串
 */
function duckIcon(variant, px, brand) {
  var open = '<svg width="' + px + '" height="' + px + '" viewBox="0 0 ' + DUCK_VB + ' ' + DUCK_VB + '">';

  if (variant === 'mini') {
    // 现状：圆角主色块 + 白盘（盘内 evenodd 挖出鸭头）+ 白眼点
    return open
      + '<rect x="0" y="0" width="1024" height="1024" rx="229.38" fill="' + brand + '"/>'
      + '<path d="' + DISC_HEAD + '" fill="#FFF" fill-rule="evenodd"/>'
      + '<circle cx="' + EYE.cx + '" cy="' + EYE.cy + '" r="' + EYE.rMini + '" fill="#FFF"/>'
      + '</svg>';
  }

  if (variant === 'disc') {
    // 去掉外层圆角块，改为「主色实心圆盘 + 白色鸭头」。
    // 反相后鸭头由「镂空」变「白色实体」，笔画自此获得完整像素，
    // 与 app-icon-android-foreground 采用的同一思路（前景不能靠镂空表达）。
    return open
      + '<circle cx="512" cy="512" r="504" fill="' + brand + '"/>'
      + '<path d="' + HEAD_DISC + '" fill="#FFF"/>'
      + '<circle cx="' + EYE_DISC.cx + '" cy="' + EYE_DISC.cy + '" r="' + EYE_DISC.r
      + '" fill="' + brand + '"/>'
      + '</svg>';
  }

  // head：纯鸭头剪影，无容器，占画板 92%。
  // 24px 下鸭头本身能拿到全部 24 像素，是三者中笔画最粗的一版。
  return open
    + '<path d="' + HEAD_FILL + '" fill="' + brand + '"/>'
    + '<circle cx="' + EYE_FILL.cx + '" cy="' + EYE_FILL.cy + '" r="' + EYE_FILL.r
    + '" fill="#FFF"/>'
    + '</svg>';

/**
 * 拼一条 390×64 的底部导航栏。

    var glyph;
    if (items[i].icon === null) {
      glyph = duckIcon(cfg.mid || 'mini', 24, color);
    } else if (items[i].icon.emoji) {
      glyph = '<div class="emoji">' + items[i].icon.emoji + '</div>';
    } else {

    }
    html += '<div class="cell ' + (on ? 'on' : 'off') + '">' + glyph

  }
  return html + '</div>';

    + '<p class="note">' + o.note + '</p>'
    + o.bar
    + '<div class="zoom">';

    html += '<figure>' + o.zooms[i].svg
          + '<figcaption>' + o.zooms[i].cap + '</figcaption></figure>';
  }
  html += '</div>';
  if (o.verdict) {
    html += '<p class="verdict ' + (o.verdictCls || '') + '">' + o.verdict + '</p>';
  }
  return html + '</div>';
}
