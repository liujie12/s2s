          schema: { type: number, format: double, example: 30.28 }
        - name: zoom
          in: query
          required: true
          description: 当前地图缩放级别，决定 cluster / pin 模式切换
          schema: { type: number, format: float, example: 14.5 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
