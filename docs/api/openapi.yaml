  # ===========================================================================
  # 分组三：发布与媒体（共 11 个接口，Batch1 覆盖 7 个）
  # ===========================================================================

  /media/upload/ticket:
    post:
      tags: [post]
      summary: 申请 OSS 直传票据（两步式第 1 步）
      operationId: createUploadTicket
      x-batch: Batch1
      x-domain: post
      description: |
        ### OSS 两步式直传的七条安全约束

        1. 客户端**不持有任何长期密钥**，仅拿到短时效的直传签名
        2. OSS 桶**不开公共读**，下发的 `url` 为带签名的临时访问地址
        3. **原图删除与 `commit` 在同一事务内同步完成**（不走异步补偿）
        4. 不挂 CDN；若挂则必须禁用图片处理过滤参数
        5. `media_id` 与 OSS 对象名（`object_key`）**均由服务端生成**，客户端不可指定
        6. OSS 侧强制 `content-length-range` 与 `content-type` 白名单，
           `commit` 时服务端**二次校验**实际对象的大小与类型
        7. 以 OSS 回调为 `commit` 的触发源；24h 未 `commit` 的 pending 记录由定时任务清理；
           `commit` 成功后对象**不可覆写**
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size, content_type]
              properties:
                filename:
                  type: string
                  maxLength: 128
                  description: 原始文件名，仅用于记录与后缀推断，不作为对象名
                  example: IMG_0421.jpg
                size:
                  type: integer
                  format: int32
                  description: 文件字节数。超出 OSS content-length-range 上限回 40001
                  example: 1843200
                content_type:
                  type: string
                  description: |
                    MIME 类型，须在服务端白名单内。图片：image/jpeg、image/png、image/webp；
                    音频（B2-4 模式② 语音零键盘）：audio/mpeg、audio/mp4、audio/aac、audio/wav、audio/x-m4a。
                  enum: [image/jpeg, image/png, image/webp, audio/mpeg, audio/mp4, audio/aac, audio/wav, audio/x-m4a]
      responses:
        '200':
          description: 票据签发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadTicket'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

