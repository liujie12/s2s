# =============================================================================
# S2S（Supply-to-Supply 本地供需撮合）API 接口契约
# -----------------------------------------------------------------------------
# 规格版本：OpenAPI 3.0.3
# 唯一口径源：
#   - docs/PRD.md §12（接口需求，错误码表以 §12.5 为准）
#   - docs/architecture/系统总体架构设计文档.md §6（接口契约落地）、§9（接口批次矩阵）
#   - docs/architecture/可观测性架构方案.md §4（埋点事件）
#   - docs/database/数据库设计文档.md + docs/database/ddl/V1__init_schema.sql（字段类型）
#   - lib/nfr_constants.dart（性能与容量常量，禁止在本文件复制字面量含义）
#
# 批次约定（x-batch 扩展字段）：
#   Batch1 = 2026-09-30 内测包范围，共 20 个业务接口 + 1 个埋点接口 /track/events（另计）
#   Batch2 / Batch3 = 后续批次，本文件仅以 x-batch 标注占位，未展开出入参
#
# 全局纪律（对所有接口生效，不在每个接口重复声明）：
#   1. 统一响应包：任何 HTTP 状态码下响应体均为 {code, message, data, request_id}
#   2. code=0 表示成功；非 0 时 data 为 null，message 为可直接呈现的中文文案
#   3. request_id 由服务端生成，是 UI 报错唯一回显值；缓存命中时不存在（预期行为）
#   4. 所有写接口必须携带 Idempotency-Key 请求头，24h 内重复 Key 返回首次结果
#   5. 时间统一 RFC3339 UTC（形如 2026-09-30T12:00:00Z）；坐标统一 GCJ-02
#   6. 响应强制 gzip；全站无 multipart（图片走 OSS 两步式直传）
# =============================================================================

openapi: 3.0.3

info:
  title: S2S 本地供需撮合平台 API
  version: 1.0.0-batch1
  description: |
    ## 1. 基础约定

    | 项 | 口径 |
    | --- | --- |
    | 基址 | `https://<自有域名>/api/v1` |
    | 时间格式 | RFC3339 UTC，例 `2026-09-30T12:00:00Z` |
    | 坐标系 | GCJ-02（火星坐标），经纬度均保留 5 位小数 |
    | 分页 | `page` 从 1 起，`page_size` 默认 20、上限 50 |
    | 压缩 | 响应强制 gzip |
    | 文件上传 | 无 multipart，统一 OSS 两步式直传（ticket + commit） |

    ## 2. 统一响应包

    ```json
    { "code": 0, "message": "ok", "data": { }, "request_id": "req_7f3a..." }
    ```

    - `code`：业务码，`0` 为成功，非 0 见错误码表；**前 3 位与 HTTP 状态码对齐**
    - `message`：中文文案，非 0 时可直接呈现给用户
    - `data`：成功时为业务负载，失败时恒为 `null`
    - `request_id`：服务端生成的请求标识，是 UI 报错时唯一回显值

    ## 3. 错误码表（25 个 code：成功码 1 个 + 错误码 24 个）

    | code | HTTP | 含义 | 用户可见 | Retry-After |
    | --- | --- | --- | --- | --- |
    | 0 | 200 | 成功 | - | - |
    | 40001 | 400 | 参数缺失或非法 | 是 | - |
    | 40002 | 400 | 未勾选用户协议与隐私政策 | 是 | - |
    | 40101 | 401 | 未登录或登录态失效 | 是（静默续期） | - |
    | 40105 | 401 | 验证码连续错误，登录锁定 15 分钟 | 是 | 是 |
    | 40301 | 403 | 未实名，今日详情浏览额度已用尽 | 是 | - |
    | 40302 | 403 | 高敏类目需先完成资质认证 | 是 | - |
    | 40303 | 403 | 该类目当前禁止发布 | 是 | - |
    | 40304 | 403 | 未实名用户发布数量已达上限 | 是 | - |
    | 40305 | 403 | 无权限访问该资源（后台 RBAC 越权，含读与写） | 是（**后台专用**，App 端不返回） | - |
    | 40901 | 409 | 内容命中敏感词 | 是 | - |
    | 40902 | 409 | 图片未通过审核 | 是 | - |
    | 40903 | 409 | 数据已被其他操作修改（乐观锁冲突） | 是 | - |
    | 41001 | 410 | 帖子已下架或已过期 | 是 | - |
    | 42901 | 429 | AI 生成配额已用尽 | 是 | 是 |
    | 42902 | 429 | 联系次数超出每日限额 | 是 | 是 |
    | 42903 | 429 | 异常操作已触发熔断，当日冻结 | 是 | 是 |
    | 42904 | 429 | 推送频次受限 | 是 | 是 |
    | 42905 | 429 | 验证码发送过于频繁 | 是 | 是 |
    | 42906 | 429 | 埋点上报频次受限 | **否**（唯一不向用户呈现） | 是 |
    | 42907 | 429 | 未登录详情浏览超限（设备 30 / IP 100 每日） | 是（提示附登录入口） | 是 |
    | 50001 | 500 | 服务内部错误 | 是 | - |
    | 50301 | 503 | AI 服务暂不可用 | 是 | - |
    | 50302 | 503 | 认证服务暂不可用 | 是 | - |
    | 50303 | 503 | 地图定位服务暂不可用 | 是 | - |

    **`Retry-After` 响应头**：`42901`–`42907` 与 `40105` 必须回剩余秒数（整数秒）。

    ## 4. 客户端错误码行为四分类

    | 类别 | code | 客户端行为 |
    | --- | --- | --- |
    | 可自动重试 | `50001` `50301` `50302` `50303` + 网络超时 | **总共**最多 2 次，退避 1s / 2s，叠加 ±20% 抖动 |
    | 不可自动重试（须提示） | `42901`–`42905`、`42907` | 按 `Retry-After` 提示，不自动发起；`42907` 的提示须附登录入口 |
    | 静默退回队列 | `42906` | 埋点事件按 `Retry-After` 退回队列头部，不提示用户 |
    | 强制重取 | `40903` | 不自动重试，但必须强制重新拉取最新数据后由用户重试 |
    | 确定性失败 | `40001` `40002` `40105` `40301`–`40305` `40901` `40902` `41001` | 直接呈现 `message`，不重试 |

    ## 5. `40101` 单飞续期时序（客户端强约束）

    1. 任一请求收到 `40101` → 暂停全部 in-flight 请求与新发请求
    2. 单飞调用 `POST /auth/token/refresh`（并发场景下**实际调用次数必须等于 1**）
    3. 成功 → 重放挂起请求，且 **沿用原 `X-Interaction-Id` 与 `Idempotency-Key`（逐字相同）**
    4. 失败 → 清空本地会话并跳转登录页

    单 Token 模型，有效期 30 天；客户端**不依赖本地过期判断**，一律以服务端 `40101` 为触发源。

    <!-- 编码落地注记（2026-09-12，U5 AuthRefreshInterceptor，描述性补充，不改契约）：
         上述第 4 步「失败」细化为三分流——① refresh 自身再回 40101 或 403 段：
         leader 唯一一次清会话、挂起请求保留各自原始 40101 不重放；② 429 段：
         不清会话，异常携带本响应整数秒 Retry-After 透传；③ 网络失败/5xx/解析
         失败：不清会话，异常透传（重试不在续期拦截器内）。续期在途期间会话
         登出/换号（会话代次变更）同样丢弃结果、不写回、不重放。
         实现形态：续期请求走独立 dio，仅挂 Header/Envelope 两个拦截器（不挂
         续期/重试拦截器，防递归与嵌套重试）；挂起请求的重放经业务 dio.fetch
         重走全链，X-Interaction-Id 与 Idempotency-Key 由请求头注入「containsKey
         才写」规则逐字沿用，Authorization 由「每次重写」规则换新，是重放请求
         唯一变化的头；续期请求自身无请求体，旧 Token 仅在 Authorization 头。 -->

    ## 6. 时钟不一致口径

    | 场景 | 以谁为准 |
    | --- | --- |
    | 登录态是否过期 | 服务端 |
    | 幂等 24h 窗口 | 服务端收到请求的时间 |
    | 帖子有效期倒计时 | 允许本地时间（仅用于文案展示） |
    | 埋点事件 `ts` | 客户端采集时刻 |

  contact:
    name: S2S 服务端
  license:
    name: Proprietary

servers:
  - url: https://api.example.com/api/v1
    description: 生产环境（域名以实际备案域名替换）
  - url: http://localhost:8080/api/v1
    description: 本地开发环境

tags:
  - name: auth
    description: 鉴权与账号（功能域 auth）
  - name: category
    description: 分类与模板（功能域 category）
  - name: post
    description: 发布与媒体（功能域 post）
  - name: map
    description: 首页地图与列表（功能域 map）
  - name: contact
    description: 详情联系与举报（功能域 contact）
  - name: cert
    description: 实名与资质认证（功能域 cert，Batch2）
  - name: ai
    description: T2 AI 辅助（功能域 ai，Batch2）
  - name: notify
    description: 通知与推送（功能域 notify）
  - name: track
    description: 埋点上报（功能域 common）
  - name: city
    description: 城市与行政区划（功能域 city，定位兜底「手动选城市」数据源）
  - name: admin
    description: 运营治理后台（功能域 admin，Batch2 [153] B2-5；后台 Token 与 C 端隔离）

security:
  - bearerAuth: []

paths:

  # ===========================================================================
  # 分组一：鉴权与账号（共 9 个接口，Batch1 覆盖 6 个）
  # ===========================================================================

  /auth/sms/send:
    post:
      tags: [auth]
      summary: 发送短信验证码
      operationId: sendSmsCode
      x-batch: Batch1
      x-domain: auth
      security: []
      description: |
        **限频（超限回 `42905`，并携带 `Retry-After`）**：

        | 维度 | 阈值 |
        | --- | --- |
        | 同手机号 | 1 分钟 1 条 / 1 小时 5 条 / 1 天 10 条 |
        | 同 IP | 1 小时 20 条 |

        限频维度为「渠道级」，保留手机号维度（不使用 `user_id`，此时尚未登录）。
        计数键存 Redis，允许丢失。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, scene]
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  description: 中国大陆手机号，11 位
                  example: '13800138000'
                scene:
                  type: string
                  enum: [login, bind]
                  description: 验证码场景。`login` = 登录/注册；`bind` = 登录态绑定手机号（B2-6a）
      responses:
        '200':
          description: 发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          expire_in:
                            type: integer
                            description: 验证码有效期（秒）
                            example: 300
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/sms/login:
    post:
      tags: [auth]
      summary: 短信验证码登录（含首次注册）
      operationId: smsLogin
      x-batch: Batch1
      x-domain: auth
      security: []
      description: |
        - 手机号不存在则自动注册，`is_new_user=true`
        - **必须勾选协议**：`agreed=false` 或缺失回 `40002`
        - **连续 5 次验证码错误锁定 15 分钟**，回 `40105` 并携带 `Retry-After`
        - 登录成功写 `device` 表（以 `X-Device-Id` 为指纹），设备指纹**明确不可信**，
          禁止采集 IMEI / MAC / IDFA / OAID
        - 单 Token 模型，有效期 30 天
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code, agreed]
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  example: '13800138000'
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6 位数字验证码
                  example: '123456'
                agreed:
                  type: boolean
                  description: 是否已勾选《用户协议》与《隐私政策》。false 或缺失回 40002
                platform:
                  type: string
                  enum: [android, ios]
                  description: 客户端平台，用于写 device 表
                push_token:
                  type: string
                  maxLength: 128
                  description: 推送 token，可空
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/wechat/login:
    post:
      tags: [auth]
      summary: 微信授权登录（含首次自动注册）
      operationId: wechatLogin
      x-batch: Batch2
      x-domain: auth
      security: []
      description: |
        客户端经微信 SDK 拉起授权后拿到一次性 code（最长 64 字符），服务端向微信服务器
        交换 **unionid**（HTTPS GET api.weixin.qq.com/sns/oauth2/access_token），unionid 不存在
        则拒绝登录（40001，避免同一用户产生第二条身份）；unionid 不存在于 `user_identity`
        则自动注册（user + user_identity，同事务）。Token 签发与短信登录完全复用 JwtIssuer
        （单 Token 模型，30 天有效期）。

        错误码不新增（遵循编码红线"不新增错误码"）：凭据未配置 → 50001 INTERNAL_ERROR；
        code 无效/过期/缺 unionid → 40001 PARAM_INVALID；微信服务器不可用 → 50302 CERT_UNAVAILABLE；
        设备维 / IP 维限频超限（各 20/h，架构 §5.1.1 门禁①）→ 42905 SMS_LIMIT（带 Retry-After）。

        **懒绑定（2026-10-18 裁定）**：首次微信登录允许创建未绑定手机号的账号；
        该账号可浏览，但发布/联系会被 40302 拦截，引导完成 `POST /auth/phone/bind`。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, agreed]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: 微信授权 code（一次性，来自客户端微信 SDK）
                agreed:
                  type: boolean
                  description: 必为 true，缺或 false → 40002 AGREEMENT_REQUIRED
                platform:
                  type: string
                  enum: [android, ios]
                  description: 可选，设备 OS（写入 device.platform）
                push_token:
                  type: string
                  maxLength: 128
                  description: 可选，推送 token（写入 device.push_token）
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/phone/bind:
    post:
      tags: [auth]
      summary: 绑定手机号（登录态，懒绑定入口）
      operationId: bindPhone
      x-batch: Batch2
      x-domain: auth
      description: |
        登录态用户把手机号身份挂到当前账号（B2-6a，2026-10-18 裁定：懒绑定）。
        典型入口：微信用户点击发布/联系收到 40302 后进入绑定页。验证码由
        `POST /auth/sms/send` 的 `scene=bind` 下发。

        **冲突口径**：手机号已属于其他账号 → 40302（需完成必要认证/绑定），
        不自动合并、不迁移数据；提示用户改用手机号登录。
        当前账号已绑定其他手机号 → 40001；同号重复提交幂等成功。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                  pattern: '^1[3-9]\d{9}$'
                  example: '13800138000'
                code:
                  type: string
                  pattern: '^\d{6}$'
                  description: 6 位数字验证码
      responses:
        '200':
          description: 绑定成功，返回更新后的本人资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MyProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /auth/wechat/bind:
    post:
      tags: [auth]
      summary: 绑定微信（登录态，设置页入口）
      operationId: bindWechat
      x-batch: Batch2
      x-domain: auth
      description: |
        登录态用户（典型为手机号老账号）把微信身份挂到当前账号（B2-6a）。
        设置页「账号与安全 - 绑定微信」调用；客户端先用微信 SDK 取得一次性 code。

        **冲突口径**：unionid 已属于其他账号 → 40302（需完成必要认证/绑定），
        不迁移任何业务数据；当前账号已绑定其他微信 → 40001；同 unionid 重复提交幂等成功。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  maxLength: 64
                  description: 微信授权 code（一次性，来自客户端微信 SDK）
      responses:
        '200':
          description: 绑定成功，返回更新后的本人资料
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MyProfile'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /auth/token/refresh:
    post:
      tags: [auth]
      summary: 续期登录态（单飞调用）
      operationId: refreshToken
      x-batch: Batch1
      x-domain: auth
      description: |
        由客户端在收到任意 `40101` 后**单飞**调用（并发场景实际调用次数必须等于 1）。
        请求需携带当前（已失效）Token 于 `Authorization` 头，**无请求体**（单 Token 模型）。
        续期失败（返回 `40101`）时客户端必须清空会话并跳转登录页。

        编码落地注记（2026-09-12，U5，描述性补充不改契约）：失败处置按错误类别三分流，
        详见 info.description 第 5 节——refresh 自身 40101/403 段才清会话；429 段不清会话、
        透传 `Retry-After`；网络失败/5xx 不清会话、异常透传。本端点由独立 dio 调用，
        仅挂请求头注入与信封拆包两个拦截器，不挂续期/重试拦截器。

        响应键语义子集（评审 #2，2026-09-14 补形式契约）：400 = 请求形态非法（如缺
        Authorization 头，40001）；403 = 服务端按策略拒绝续期；429 = 触发频控/熔断，
        复用 TooManyRequests 组件且必带 `Retry-After`，本端点不清会话。复用组件按全仓
        惯例「组件列全部可能码、端点按语义子集实现」：Unauthorized 组件中的 40105、
        Forbidden 组件中的 40301–40305 是组件全集，refresh 实际只返回其中语义子集，
        不为此端点拆专用响应组件。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 续期成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token:
                            type: string
                            description: 新的 JWT
                          expire_at:
                            type: string
                            format: date-time
                            description: 新 Token 到期时间（服务端为准）
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

