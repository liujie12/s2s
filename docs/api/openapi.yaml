  /posts/{post_id}/status:
    patch:
      tags: [post]
      summary: 变更帖子状态（下架 / 重新上架 / 延期）
      operationId: updatePostStatus
      x-batch: Batch1
      x-domain: post
      description: |
        ### 乐观锁强约束

        - 入参**必须携带 `version`**；缺失回 `40001`，**服务端不得兜底**
          （不允许「不传就跳过版本校验」）
        - 更新语句形如 `UPDATE post SET ... WHERE id=? AND version=?`
        - 影响行数为 0 → 回 `40903`，客户端必须强制重取详情后由用户重试

        ### 写守卫分流

        | 变更来源 | 守卫条件 |
        | --- | --- |
        | 用户意图变更（本接口） | 守 `version`（乐观锁） |
        | 系统派生变更（定时任务到期下架等） | 守 `status IN (合法前驱集)`，不守 `version` |

        **0 行统一回 `40903`**：归属（`user_id`）与 `version` 一并进 WHERE，故「非本人」
        「版本不符」「行不存在」三种成因不区分——既不泄露「该 id 存在且属他人」，也避免
        调用方按错误码探测归属。因此本操作不产生 `403`/`410`（契约已相应收敛）。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action:
                  type: string
                  enum: [offline, republish, renew]
                  description: |
                    - `offline`：下架（active → offline）
                    - `republish`：重新上架（offline → active，重算 expire_at）
                    - `renew`：延期（active → active，顺延 expire_at）
                version:
                  type: integer
                  format: int64
                  description: 从 GET 详情或 GET /posts/mine 取得的当前版本号。**缺失回 40001**
      responses:
        '200':
          description: 变更成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
                          status: { $ref: '#/components/schemas/PostStatusEnum' }
                          expire_at: { type: string, format: date-time }
                          version:
                            type: integer
                            format: int64
                            description: 变更后的新版本号
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

