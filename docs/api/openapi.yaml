components:

  # ===========================================================================
  # 安全方案
  # ===========================================================================
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        单 Token 模型，有效期 30 天。请求头形如 `Authorization: Bearer <JWT>`。
        Token 失效由服务端回 `40101` 触发客户端单飞续期，
        客户端**不做本地过期判断**。

  # ===========================================================================
  # 复用参数：四个自定义请求头 + 通用分页 + 通用路径参数
  # ===========================================================================
  parameters:

    XInteractionId:
      name: X-Interaction-Id
      in: header
      required: true
      description: |
        **客户端生成**的交互标识，覆盖「缓存 → 网络 → 聚合 → 渲染」四段全链路。
        服务端**仅用于日志串联**，**严禁**用于鉴权、限流、幂等判定。
        与 `request_id` 分工不同：`request_id` 由服务端生成、是 UI 报错唯一回显值。
        `40101` 重放挂起请求时必须**沿用原值**（逐字相同）。

        ### 例外：POST /track/events

        埋点上报是本系统唯一**没有交互起点**的调用场景 —— 定时触发、进后台触发、
        登录后补报、离线回灌，四种触发方式都不属于任何进行中的用户交互；
        且一批最多 50 条事件**可能来自几十个不同交互**，让批次沿用其中任一条的
        `interaction_id` 都是错的（会把整批的排查线索指向一个无关交互）。

        因此在该接口上，本头的语义收窄为「**这一次上报传输动作**」：

        - 由上报器**为每个批次新生成**一个值，仍满足 required；
        - 事件自身所属的交互保留在**请求体** `events[].interaction_id` 字段里，
          与本头**互不覆盖**；
        - 重发（失败退回队列后重新组批）时**必须换新值**，不沿用 —— 与上面
          `40101` 重放的规则相反，因为重新组批就是一次新的传输动作。

        排查方式：查某个用户交互用事件体内的 `interaction_id`；
        查某次上报为何失败用本头的值。
      schema:
        type: string
        maxLength: 64
        example: itx_1a2b3c4d5e6f

    XDeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: |
        首次启动生成的 UUID v4，落 `device.fingerprint`。
        **明确不可信**（可被清数据重置），仅作风控辅助维度之一。
        **严禁**采集 IMEI / MAC / IDFA / OAID 等设备唯一标识。
      schema:
        type: string
        format: uuid
        example: 3f2504e0-4f89-41d3-9a0c-0305e82c3301

    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        **所有写接口必带**。UUID v4，36 字符，小写，带连字符。

        正则：`^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$`
        不符合回 `40001`。

        ### 四类必测输入

        | 场景 | 期望行为 |
        | --- | --- |
        | 缺失该头 | 回 `40001`，**不得放行** |
        | 大写 UUID 或 v1 UUID | 判非法，回 `40001` |
        | 重复 Key 但请求体不同 | **返回首次结果**（不按新请求体执行） |
        | 首次执行失败后用同 Key 重放 | **必须重新执行**（只有成功响应才进缓存） |

        窗口 24 小时（见 `NfrApi.idempotencyWindowHours`），
        以**服务端收到请求的时间**为准。键与首次响应体存 Redis。
        `40101` 重放挂起请求时必须**沿用原值**（逐字相同）。
        网络层重试（`50001` / `503xx` / 网络失败）同样必须**沿用原值** ——
        客户端 `HeaderInterceptor` 注入前须先判该头是否已存在，已存在则不覆盖。

        ### 例外：POST /track/events —— 每次组批必须换新 Key

        埋点批次的幂等语义与其他写接口**相反**，原因在于「重发的内容会变」：

        上报失败的批次退回队列**头部**后，会与期间新采集的事件**重新组批**，
        内容已经不是首次那一批了。而上表第三行规定「重复 Key 但请求体不同 →
        返回首次结果」，服务端会**直接命中幂等缓存返回 `code=0`，业务逻辑一行不执行**。

        于是形成这个静默丢失链条：

        ```
        第 1 次上报 50 条 → 服务端返 42906，一条未落库
        退回队列头部      → 期间新采集 20 条
        第 2 次组批       → 内容变为「原 50 条的部分 + 新 20 条」
           若沿用旧 Key   → 命中幂等缓存 → 回 code=0
                          → 客户端判成功，把 70 条全部出队
        结果：70 条事件一条未落库，且【不产生任何错误日志】
        ```

        `dropped_count` 也不会 +1（它只统计容量溢出丢弃），所有可观测性指标都是绿的
        —— 可观测性系统自己成了盲区。

        **规则：该接口每次组批生成新的 `Idempotency-Key`**（批次是「一次传输动作」，
        不是「一笔业务意图」）。

        由此带来的重复写入风险（响应丢在回程 → 同批写两次）由服务端按**事件维度**
        去重兜住，**不依赖幂等键**：埋点库唯一索引
        `uk_event_dedup(interaction_id, event_name, user_id, ts)`，
        落库用 `INSERT ... ON DUPLICATE KEY UPDATE id = id`。详见该接口的 description。
        取舍方向明确：宁可重一条（分析侧可去重），不可丢一条（永久不可恢复）。
      schema:
        type: string
        pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
        example: 9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d

    PageParam:
      name: page
      in: query
      required: false
      description: 页码，从 1 起
      schema: { type: integer, format: int32, minimum: 1, default: 1 }

    PageSizeParam:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认见 NfrApi.pageSizeDefault，上限见 NfrApi.pageSizeMax
      schema: { type: integer, format: int32, minimum: 1, maximum: 50, default: 20 }

    PostIdPath:
      name: post_id
      in: path
      required: true
      description: 帖子 ID
      schema: { type: integer, format: int64, example: 1001 }

  # ===========================================================================
  # 复用响应：按 HTTP 状态码组织，每个响应列明其可能承载的全部业务 code
  # ===========================================================================
  responses:

    BadRequest:
      description: |
        `40001` 参数缺失或非法 / `40002` 未勾选用户协议与隐私政策
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            missingParam:
              summary: 参数缺失（40001）
              value: { code: 40001, message: 缺少必填参数 grid_id, data: null, request_id: req_7f3a91 }
            notAgreed:
              summary: 未勾选协议（40002）
              value: { code: 40002, message: 请先阅读并同意用户协议与隐私政策, data: null, request_id: req_7f3a92 }

    Unauthorized:
      description: |
        `40101` 未登录或登录态失效（客户端触发单飞续期） /
        `40105` 验证码连续错误导致登录锁定 15 分钟（**携带 `Retry-After`**）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            expired:
              summary: 登录态失效（40101）
              value: { code: 40101, message: 登录已过期，请重新登录, data: null, request_id: req_7f3a93 }
            locked:
              summary: 登录锁定（40105）
              value: { code: 40105, message: 验证码错误次数过多，请 15 分钟后再试, data: null, request_id: req_7f3a94 }

    Forbidden:
      description: |
        `40301` 未实名今日详情额度用尽（Batch1 由开关关闭） /
        `40302` 高敏类目需先完成资质认证 /
        `40303` 该类目当前禁止发布 /
        `40304` 未实名用户发布数量已达上限 /
        `40305` 无权限访问该资源（**后台 RBAC 越权专用**，App 端接口不返回此码）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            quotaExhausted:
              summary: 详情额度用尽（40301）
              value: { code: 40301, message: 今日可查看详情数量已用完，完成实名后不受限制, data: null, request_id: req_7f3a95 }
            needQualification:
              summary: 缺资质（40302）
              value: { code: 40302, message: 该类目需先完成资质认证, data: null, request_id: req_7f3a96 }
            categoryBanned:
              summary: 类目禁发（40303）
              value: { code: 40303, message: 该类目当前禁止发布, data: null, request_id: req_7f3a97 }
            publishLimit:
              summary: 发布上限（40304）
              value: { code: 40304, message: 未实名用户发布数量已达上限, data: null, request_id: req_7f3a98 }

    Conflict:
      description: |
        `40901` 内容命中敏感词 /
        `40902` 图片未通过审核 /
        `40903` 数据已被其他操作修改（乐观锁冲突，客户端须强制重取后由用户重试）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            sensitiveWord:
              summary: 敏感词（40901）
              value: { code: 40901, message: 内容包含不允许发布的词汇，请修改后重试, data: null, request_id: req_7f3a99 }
            imageRejected:
              summary: 图片未过审（40902）
              value: { code: 40902, message: 图片未通过审核，请更换后重试, data: null, request_id: req_7f3a9a }
            versionConflict:
              summary: 乐观锁冲突（40903）
              value: { code: 40903, message: 数据已更新，请刷新后重试, data: null, request_id: req_7f3a9b }

    Gone:
      description: '`41001` 帖子已下架或已过期'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: 41001, message: 该信息已下架或已过期, data: null, request_id: req_7f3a9c }

    TooManyRequests:
      description: |
        `42901` AI 配额已用尽 /
        `42902` 联系次数超出每日限额 /
        `42903` 异常操作触发熔断当日冻结 /
        `42904` 推送频次受限 /
        `42905` 验证码发送过于频繁 /
        `42906` 埋点上报频次受限（**唯一不向用户呈现**，客户端静默退回队列） /
        `42907` 未登录详情浏览超限（设备 30 / IP 100 每日，任一超限即拒）

        以上 7 个 code **必须携带 `Retry-After`** 响应头，值为剩余整数秒。
        `42901`–`42905`、`42907` 客户端**不可自动重试**，须按 `Retry-After` 提示用户。
        `42907` 的提示须附登录入口，且**不告知是哪个维度超限**（风控阈值不外泄）。
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            aiQuota:
              summary: AI 配额（42901）
              value: { code: 42901, message: 今日 AI 辅助次数已用完, data: null, request_id: req_7f3a9d }
            contactLimit:
              summary: 联系超限（42902）
              value: { code: 42902, message: 今日查看联系方式次数已达上限, data: null, request_id: req_7f3a9e }
            circuitBreak:
              summary: 熔断冻结（42903）
              value: { code: 42903, message: 操作过于频繁，该功能今日已暂停使用, data: null, request_id: req_7f3a9f }
            pushLimit:
              summary: 推送频控（42904）
              value: { code: 42904, message: 推送发送过于频繁, data: null, request_id: req_7f3aa0 }
            smsLimit:
              summary: 验证码频控（42905）
              value: { code: 42905, message: 验证码发送过于频繁，请稍后再试, data: null, request_id: req_7f3aa1 }
            trackLimit:
              summary: 埋点频控（42906，不呈现给用户）
              value: { code: 42906, message: track rate limited, data: null, request_id: req_7f3aa2 }
            guestDetailLimit:
              summary: 未登录详情浏览超限（42907）
              value: { code: 42907, message: 今日浏览次数较多，登录后可继续查看, data: null, request_id: req_7f3aa3 }

    InternalError:
      description: |
        `50001` 服务内部错误。客户端**可自动重试**，
        与 `50301`/`50302`/`50303` 及网络超时共享「总共 2 次」的重试预算，
        退避 1s / 2s 并叠加 ±20% 抖动。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          example: { code: 50001, message: 服务繁忙，请稍后重试, data: null, request_id: req_7f3aa3 }

    ServiceUnavailable:
      description: |
        `50301` AI 服务暂不可用 /
        `50302` 认证服务暂不可用 /
        `50303` 地图定位服务暂不可用

        三者均**可自动重试**（与 `50001` 共享总共 2 次预算）。
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
          examples:
            aiDown:
              summary: AI 不可用（50301）
              value: { code: 50301, message: AI 服务暂时不可用，请稍后重试, data: null, request_id: req_7f3aa4 }
            certDown:
              summary: 认证服务不可用（50302）
              value: { code: 50302, message: 认证服务暂时不可用，请稍后重试, data: null, request_id: req_7f3aa5 }
            mapDown:
              summary: 定位服务不可用（50303）
              value: { code: 50303, message: 定位服务暂时不可用，请检查定位权限或稍后重试, data: null, request_id: req_7f3aa6 }

  # ===========================================================================
  # 复用响应头
  # ===========================================================================
  headers:
    RetryAfter:
      description: |
        剩余可重试秒数（**整数**，非 HTTP-date 形式）。
        `42901`–`42907` 与 `40105` **必须**返回本头。
      required: true
      schema: { type: integer, format: int32, minimum: 1, example: 900 }

  # ===========================================================================
  # 数据模型
  # ===========================================================================
  schemas:

    # ---------- 统一响应包 ----------

    ApiEnvelope:
      type: object
      description: |
        统一响应包骨架。所有接口无论成功失败均返回该结构，
        各接口通过 `allOf` 收窄 `data` 的具体类型。
      required: [code, message]
      properties:
        code:
          type: integer
          format: int32
          description: 业务码。0 成功；非 0 见错误码表，前 3 位与 HTTP 状态码对齐
          example: 0
        message:
          type: string
          description: 中文文案。非 0 时可直接呈现给用户
          example: ok
        data:
          description: 业务负载。失败时恒为 null
          nullable: true
        request_id:
          type: string
          description: |
            服务端生成的请求标识，是 UI 报错时唯一回显值。
            **缓存命中时该字段不存在**，属预期行为。
          example: req_7f3a91c2

    ApiError:
      type: object
      description: 失败响应（`data` 恒为 null）
      required: [code, message, request_id]
      properties:
        code: { type: integer, format: int32, example: 40001 }
        message: { type: string, example: 缺少必填参数 grid_id }
        data: { nullable: true, example: null }
        request_id: { type: string, example: req_7f3a91c2 }

    # ---------- 运营治理后台（功能域 admin，[153] B2-5） ----------

    AdminMatchConfig:
      type: object
      description: 撮合权重配置 + AB 开关（PRD §9.10.1 ③；权重口径 §6.11）
      required: [weight_time, weight_distance, weight_completeness, gbdt_enabled, gray_ratio]
      properties:
        weight_time: { type: number, format: double, example: 0.4 }
        weight_distance: { type: number, format: double, example: 0.4 }
        weight_completeness: { type: number, format: double, example: 0.2 }
        gbdt_enabled: { type: boolean, description: GBDT override 开关 }
        gray_ratio:
          type: integer
          format: int32
          description: AB 灰度比例（整数百分比 0–100）
          example: 10

    AdminSwitchConfig:
      type: object
      description: 模型/性能降级开关（PRD §9.10.1 ⑦）
      required: [model_downgrade_enabled, perf_downgrade_enabled]
      properties:
        model_downgrade_enabled: { type: boolean, description: 模型降级开关（§6.12 冷启动降级） }
        perf_downgrade_enabled: { type: boolean, description: 性能降级开关（§6.10.1） }

    AdminCategoryItem:
      type: object
      description: 分类行（后台视角，含不下发客户端的可配字段；PRD §9.10.1 ①）
      required: [id, level, name]
      properties:
        id: { type: integer, format: int32, description: 类目 ID（即层级编号） }
        parent_id: { type: integer, format: int32, nullable: true, description: 父类目 ID（顶级为 null） }
        level: { type: integer, format: int32, description: 层级 1/2/3 }
        name: { type: string }
        icon: { type: string, nullable: true, description: Material Symbols 图标名 }
        need_cert:
          type: string
          nullable: true
          description: 高敏所需认证类型（null = 非高敏）
        forbidden: { type: integer, format: int32, description: 禁发标记 0/1 }
        sort_order: { type: integer, format: int32, description: 同级排序 }
        cluster_threshold: { type: integer, format: int32, description: 差异化聚合阈值 }

    AdminCategoryList:
      type: object
      description: 分类配置全量列表（PRD §9.10.1 ①）
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminCategoryItem' }

    AdminCategoryCreateRequest:
      type: object
      description: 新增叶子类目入参（PRD §9.10.1 ①）
      required: [parent_id, name]
      properties:
        parent_id: { type: integer, format: int32, description: 挂载的二级类目 ID（非 L2 → 40001） }
        name: { type: string, maxLength: 32 }
        icon: { type: string, maxLength: 64 }
        need_cert: { type: string, maxLength: 32, description: 高敏所需认证类型（可空） }
        forbidden: { type: integer, format: int32, minimum: 0, maximum: 1 }
        sort_order: { type: integer, format: int32 }

    AdminCategoryUpdateRequest:
      type: object
      description: 更新类目入参（null 字段 = 不改该列；PRD §9.10.1 ①）
      properties:
        name: { type: string, maxLength: 32 }
        icon: { type: string, maxLength: 64 }
        need_cert: { type: string, maxLength: 32 }
        forbidden: { type: integer, format: int32, minimum: 0, maximum: 1 }
        sort_order: { type: integer, format: int32 }

    AdminTemplate:
      type: object
      description: 模板读取出参（PRD §9.10.1 ②）
      required: [template_key, template_version]
      properties:
        template_key: { type: integer, format: int32, description: 模板键（L2 类目 ID） }
        template_version: { type: integer, format: int32, description: 当前版本号（0 = 无自定义模板） }
        fields:
          type: array
          nullable: true
          description: Schema 字段数组（null = 无自定义模板，前端按通用模板渲染）
          items: { type: object, additionalProperties: true }

    AdminTemplateSaveRequest:
      type: object
      description: 模板保存入参（PRD §9.10.1 ②）
      required: [fields]
      properties:
        fields:
          type: array
          minItems: 1
          description: 新 Schema 字段数组（非空；非法 → 40001）
          items: { type: object, additionalProperties: true }

    AdminReportItem:
      type: object
      description: 举报工单行（PRD §9.10.1 ④、§9.10.3）
      required: [report_id, post_id, reason, status, risk_score]
      properties:
        report_id: { type: integer, format: int64 }
        post_id: { type: integer, format: int64 }
        post_title: { type: string, description: 被举报帖子标题 }
        reason: { type: string, description: 举报原因枚举 }
        weight: { type: integer, format: int32, description: 该举报的风险分贡献 }
        status: { type: string, description: 工单状态 }
        is_false_report: { type: integer, format: int32, description: 是否已打标误报（0/1） }
        risk_score: { type: integer, format: int32, description: 被举报帖子累计风险分 }
        created_at: { type: string, format: date-time, description: 举报时间 }

    AdminReportPage:
      type: object
      description: 举报工单分页（PRD §9.10.1 ④）
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminReportItem' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        page_size: { type: integer, format: int32 }

    AdminReportHandleRequest:
      type: object
      description: 举报工单处理入参（PRD §9.10.1 ④）
      required: [action]
      properties:
        action:
          type: string
          enum: [false_report, offline]
          description: false_report=打标误报（回撤风险分）；offline=判定下架

    AdminFollowUpItem:
      type: object
      description: 待运营跟进队列条目（PRD §6.4.4）
      required: [id, status]
      properties:
        id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, nullable: true, description: 触发检索的用户（游客为 null） }
        keyword: { type: string, nullable: true }
        l2_category_id: { type: integer, format: int32, nullable: true }
        grid_id: { type: string, nullable: true, description: 坐标网格（约 500m，粗粒度） }
        status: { type: string, description: pending/handled }
        triggered_at: { type: string, format: date-time }

    AdminFollowUpPage:
      type: object
      description: 待运营跟进队列分页（PRD §6.4.4）
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminFollowUpItem' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        page_size: { type: integer, format: int32 }

    AdminFollowUpHandleRequest:
      type: object
      description: 跟进队列处理入参（PRD §6.4.4）
      properties:
        remark: { type: string, maxLength: 255, description: 处理备注（可空） }

    AdminAuditExport:
      type: object
      description: 审计导出的 CSV 承载（PRD §9.10.1「导出需二次确认」）
      required: [file_name, content_type, content, row_count]
      properties:
        file_name: { type: string, description: 建议文件名（含 .csv 后缀） }
        content_type: { type: string, description: '固定 text/csv; charset=UTF-8' }
        content: { type: string, description: 同步拼好的 CSV 正文（含表头，RFC 4180） }
        row_count: { type: integer, format: int32, description: 实际导出行数（不含表头） }

    AdminCertAccessPage:
      type: object
      description: 敏感查看复核申请分页（PRD §9.10.1）
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminCertAccessItem' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        page_size: { type: integer, format: int32 }

    AdminCertAccessItem:
      type: object
      description: 敏感查看复核申请条目
      required: [id, cert_id, requester_id, reason, status]
      properties:
        id: { type: integer, format: int64 }
        cert_id: { type: integer, format: int64, description: 目标认证记录 ID }
        requester_id: { type: integer, format: int64, description: 发起人（后台账号 ID） }
        reason: { type: string, description: 查看理由 }
        status: { type: string, enum: [pending, approved, rejected] }
        reviewer_id: { type: integer, format: int64, nullable: true, description: 复核人（未复核为 null） }
        reviewed_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    AdminCertAccessCreateRequest:
      type: object
      description: 发起认证敏感查看申请入参（PRD §9.10.1）
      required: [cert_id, reason]
      properties:
        cert_id: { type: integer, format: int64, description: 目标认证记录 ID }
        reason: { type: string, maxLength: 255, description: 查看理由（必填） }

    AdminCertAccessReviewRequest:
      type: object
      description: 复核认证敏感查看申请入参（PRD §9.10.1）
      required: [approved]
      properties:
        approved: { type: boolean, description: 是否通过 }
        reason: { type: string, maxLength: 255, description: 复核说明（驳回时必填） }

    AdminCertAccessContent:
      type: object
      description: 认证原始信息（仅在复核通过且发起人本人调用时返回；每次打开写审计）
      required: [cert_id]
      properties:
        cert_id: { type: integer, format: int64 }
        ocr_image_ref: { type: string, nullable: true, description: 资质图原始引用（可空表示无资质图） }

    AdminTempCategoryList:
      type: object
      description: 临时类目分页（PRD §9.10.2）
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminTempCategoryItem' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        page_size: { type: integer, format: int32 }

    AdminTempCategoryItem:
      type: object
      description: 临时类目条目（含 72h 判定快照；结算前统计字段为 null）
      required: [id, l2_parent_id, name, status]
      properties:
        id:
          type: integer
          format: int32
          description: 临时叶子类目 ID（= category.id）
        l2_parent_id: { type: integer, format: int32, description: 挂载的「临时」二级类目 ID }
        name: { type: string }
        status:
          type: string
          description: 生命周期
          enum: [active, expired, promoted]
        created_by: { type: integer, format: int64, nullable: true, description: 创建人（后台账号 ID） }
        created_at: { type: string, format: date-time, nullable: true }
        expire_at: { type: string, format: date-time, nullable: true, description: 自动下线时刻 }
        closed_at: { type: string, format: date-time, nullable: true, description: 结算时刻 }
        publish_count: { type: integer, format: int32, nullable: true, description: 72h 内发布数 }
        contact_count: { type: integer, format: int32, nullable: true, description: 72h 内被联系数 }
        promoted: { type: boolean, nullable: true, description: 是否达标进转正候选池 }

    AdminTempCategoryCreateRequest:
      type: object
      description: 创建临时类目入参（PRD §9.10.2）
      required: [l2_parent_id, name]
      properties:
        l2_parent_id: { type: integer, format: int32, description: 挂载的「临时」二级类目 ID }
        name: { type: string, maxLength: 32 }

    AdminReportBatchHandleRequest:
      type: object
      description: 举报工单批量处理入参（PRD §9.10.1 ④）
      required: [report_ids, action]
      properties:
        report_ids:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, format: int64 }
        action:
          type: string
          enum: [false_report, offline]

    AdminAccountItem:
      type: object
      description: 后台账号条目（不含口令哈希；PRD §9.10.1 超管「账号与角色管理」）
      required: [id, username, role, status]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        role: { type: string, description: super_admin/auditor/operator/algo }
        status: { type: string, description: active/disabled }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time, nullable: true }

    AdminAccountList:
      type: object
      description: 后台账号列表（PRD §9.10.1 超管专属）
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminAccountItem' }

    AdminAccountCreateRequest:
      type: object
      description: 新建后台账号入参（PRD §9.10.1 超管专属）
      required: [username, password, role]
      properties:
        username: { type: string, maxLength: 64 }
        password: { type: string, maxLength: 128, description: 长度下限见 NfrAdmin.PASSWORD_MIN_LENGTH }
        role: { type: string, enum: [super_admin, auditor, operator, algo] }

    AdminAccountUpdateRequest:
      type: object
      description: 修改后台账号入参（null = 不改；PRD §9.10.1 超管专属）
      properties:
        role: { type: string, enum: [super_admin, auditor, operator, algo] }
        status: { type: string, enum: [active, disabled] }

    AdminPasswordResetRequest:
      type: object
      description: 重置后台账号口令入参（PRD §9.10.1 超管专属）
      required: [new_password]
      properties:
        new_password: { type: string, maxLength: 128 }

    # ---------- 通用枚举与基础类型 ----------

    PostTypeEnum:
      type: string
      description: 供需态。resource=资源方（我有），demand=需求方（我要）
      enum: [resource, demand]

    PostStatusEnum:
      type: string
      description: |
        帖子状态。`active` 在架 / `offline` 已下架 / `expired` 已过期 / `archived` 已归档。
        有效天数与自动归档天数见 `NfrPostLifecycle`。
      enum: [active, offline, expired, archived]

    RadiusEnum:
      type: string
      description: 检索半径档位（公里，`city` 为全城）。对应 `user.default_radius` 列
      enum: ['1', '3', '5', '10', city]

    RealnameStatusEnum:
      type: string
      description: 实名状态。对应 `user.realname_status` 列
      enum: [none, pending, passed, rejected]

    DevicePlatformEnum:
      type: string
      description: |
        推送通道（B2-2）。**与 `device.platform`（OS，android/ios）是两个维度**：
        本枚举决定服务端走哪家推送服务下发，`device.platform` 只记 OS。
        境内不可用 FCM（无 Google 服务），保留枚举值仅为契约与 PRD §12 对齐。
      enum: [apns, fcm, hw, mi, oppo, vivo, honor]

    DeviceUpsertRequest:
      type: object
      required: [platform, token]
      properties:
        platform: { $ref: '#/components/schemas/DevicePlatformEnum' }
        token:
          type: string
          maxLength: 128
          description: 推送 token（与 `device.push_token` 列同长）

    DeviceUpsertResult:
      type: object
      required: [device_id, platform]
      properties:
        device_id:
          type: integer
          format: int64
          description: 被写入的 `device` 行 ID（新增或命中同一指纹）
        platform: { $ref: '#/components/schemas/DevicePlatformEnum' }

    RealnameSubmitRequest:
      type: object
      required: [real_name, id_card, agreement_accepted]
      properties:
        real_name:
          type: string
          maxLength: 64
          description: 真实姓名（明文，服务端加密落 `real_name_enc`，禁止出现在任何响应）
        id_card:
          type: string
          pattern: '^\d{17}[\dXx]$'
          description: 18 位身份证号（服务端只存 `id_card_hash` 盲索引 + `id_card_last4`，禁止出现在任何响应）
        agreement_accepted:
          type: boolean
          description: 是否已同意实名认证相关协议；false 回 40002（字段缺失按 required 走 40001 参数校验）

    RealnameSubmitResult:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/RealnameStatusEnum' }

    CertNameSourceEnum:
      type: string
      description: 证名来源。`ocr` = 自动读取未改动；`manual` = 用户手填或改写
      enum: [ocr, manual]

    CertOcrResult:
      type: object
      description: |
        证照图抽取结果。`cert_name` 可为 `null`，抽取失败不改 HTTP 状态、不报错。
      properties:
        cert_name:
          type: string
          nullable: true
          maxLength: 64
          description: 抽取到的证书名称；未读出为 `null`

    QualificationSubmitRequest:
      type: object
      description: |
        批量提交载荷：一次提交 1–9 条资质（每组 = 一张证照图 + 一个证书名）。
        整批一个事务，任一条非法或证名与本人已有资质/批内其他条重复，整批回 `40001` 不落库。
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 9
          description: 待提交资质条目；条数上限与 `media` 单帖图片上限同源
          items:
            $ref: '#/components/schemas/QualificationSubmitItem'

    QualificationSubmitItem:
      type: object
      description: 批量提交中的单条资质（一组证照图 + 一个证书名）。
      required: [media_ids]
      properties:
        media_ids:
          type: array
          minItems: 1
          description: 本条证照图 media_id 列表（首张作为证照图）
          items: { type: string }
        cert_name:
          type: string
          nullable: true
          maxLength: 64
          description: 证书名称。可空（抽取失败且用户未填）；超出 64 字回 `40001`
        name_source:
          allOf:
            - $ref: '#/components/schemas/CertNameSourceEnum'
          nullable: true
          description: 证名来源；非 `ocr` / `manual` 回 `40001`

    QualificationBatchSubmitResult:
      type: object
      description: 批量提交结果；`items` 顺序与请求 `items` 一致。
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/QualificationSubmitResult'

    QualificationUpdateRequest:
      type: object
      description: |
        编辑载荷，字段全部可选但至少传一项，否则回 `40001`。
        `media_ids` 传入即视为换图：只替换证照图引用，**本接口不重复抽取**——抽取由客户端
        在换图后先调 `/cert/ocr` 完成，再连同 `cert_name` 一并提交。
      properties:
        media_ids:
          type: array
          description: 替换证照图（只换引用，不触发抽取）；不传保留原图
          items: { type: string }
        cert_name:
          type: string
          nullable: true
          maxLength: 64
        name_source:
          allOf:
            - $ref: '#/components/schemas/CertNameSourceEnum'
          nullable: true

    QualificationSubmitResult:
      type: object
      required: [cert_id, status]
      properties:
        cert_id:
          type: integer
          format: int64
          description: 资质档案 ID（发布挂载与编辑/删除均以此为准）
        status:
          type: string
          description: 提交后状态（本轮恒 approved）
          enum: [approved]

    QualificationItem:
      type: object
      required: [cert_id, cert_name, name_source, status]
      properties:
        cert_id: { type: integer, format: int64 }
        cert_name:
          type: string
          maxLength: 64
          description: 证书名称（详情页凭证块只显示该字段）
        name_source:
          allOf:
            - $ref: '#/components/schemas/CertNameSourceEnum'
          nullable: true
        status:
          type: string
          enum: [approved]
        image_url:
          type: string
          nullable: true
          description: 证照原件访问地址（编辑页回填用）；随资质删除失效

    CertStatusResponse:
      type: object
      required: [realname, qualifications]
      properties:
        realname:
          type: object
          required: [status]
          properties:
            status: { $ref: '#/components/schemas/RealnameStatusEnum' }
        qualifications:
          type: array
          description: 本人全部资质（status 恒为 approved）
          items:
            $ref: '#/components/schemas/QualificationItem'

    AuditStatusEnum:
      type: string
      description: |
        媒体审核状态。三态双视角规则见 `/media/{media_id}/commit`。
        硬规则：`audit_status != pass` 的媒体不得出现在任何**非本人**可见的响应中。
      enum: [pending, pass, reject]

    CompletenessLevelEnum:
      type: integer
      format: int32
      description: |
        信息完整度等级，`post.completeness_level` **STORED 生成列**（不可写，
        写入报 `ERROR 3105`）。由 `required_full` / `address_precise` / `leaf_matched`
        三条件达成数映射：3→2、2→1、其他→0。
      enum: [0, 1, 2]

    CategoryVersion:
      type: string
      description: |
        分类树全局版本号。格式 `YYYY-MM-DD.N` **字符串**，
        同日再改递增 `N`、跨日重置为当日日期 `.1`；字符串比较即可判新旧。
        真源为 `system_config.category_tree_version`。
      pattern: '^\d{4}-\d{2}-\d{2}\.\d+$'
      example: '2026-08-31.1'

    GridId:
      type: string
      description: |
        约 500m 坐标网格标识，编码 `"{gx}_{gy}"`，存储类型 `varchar(24)`。
        算法与 10 条测试向量见 `/map/pins` 描述。不符正则回 `40001`。
      pattern: '^-?\d+_-?\d+$'
      example: 26700_6728

    # ---------- 鉴权与账号 ----------

    LoginResult:
      type: object
      required: [token, expire_at, is_new_user, user]
      properties:
        token:
          type: string
          description: JWT，有效期 30 天。客户端不做本地过期判断
        expire_at:
          type: string
          format: date-time
          description: 到期时间（服务端为准，仅供展示）
        is_new_user:
          type: boolean
          description: true 表示本次登录同时完成了注册，客户端应引导完善资料
        user:
          $ref: '#/components/schemas/MyProfile'

    MyProfile:
      type: object
      description: |
        本人资料。基于 `user` 表**对外视图白名单**
        （`id`/`nickname`/`avatar_url`/`realname_status`/`qualification_badges[]`）
        额外附本人可见的 `default_radius`、`phone_mask`，以及身份绑定状态
        `phone_bound`/`wechat_bound`（B2-6a；懒绑定下微信用户可能 `phone_bound=false`）。

        **`real_name_enc`、`id_card_hash` 禁止出现在任何 API 响应中。**
      required: [id, nickname, realname_status, phone_bound, wechat_bound]
      properties:
        id: { type: integer, format: int64, example: 10086 }
        nickname: { type: string, maxLength: 20, example: 老王建材 }
        avatar_url:
          type: string
          nullable: true
          description: OSS 带签名的临时访问地址
        realname_status: { $ref: '#/components/schemas/RealnameStatusEnum' }
        qualification_badges:
          type: array
          description: 已通过的资质徽章标识列表
          items: { type: string }
        default_radius: { $ref: '#/components/schemas/RadiusEnum' }
        phone_mask:
          type: string
          description: 脱敏手机号（仅本人视角可见，他人视角不下发）
          example: 138****8000
        phone_bound:
          type: boolean
          description: 是否已绑定手机号（发布/联系门禁依据）
        wechat_bound:
          type: boolean
          description: 是否已绑定微信（设置页「绑定微信」状态）

    SettingsResponse:
      type: object
      description: 我的设置（`GET/PATCH /settings` 的 `data`；[B2-11]）
      required: [notify, default_radius, privacy]
      properties:
        notify:
          type: object
          description: 通知开关（PRD §9.3）；`user_setting` 缺行时四项均回 `true`（全开）
          required: [enabled, system, interaction, cert]
          properties:
            enabled: { type: boolean, description: 消息通知总开关 }
            system: { type: boolean, description: 系统通知分通道 }
            interaction: { type: boolean, description: 互动通知分通道 }
            cert: { type: boolean, description: 认证通知分通道 }
        default_radius: { $ref: '#/components/schemas/RadiusEnum' }
        privacy:
          type: object
          description: 隐私项（PRD §9.3）。`contact_display` 只读；`personalized_recommend` 与 `ai_improve` 可经 `PATCH` 修改（算法推荐「可关闭」义务 + PIPL 第十五条撤回同意，2026-10-23 新增）
          required: [contact_display, personalized_recommend, ai_improve]
          properties:
            contact_display:
              type: string
              description: 联系方式展示策略，恒 `transit_only`（仅在联系中转时展示完整号）
              enum: [transit_only]
            personalized_recommend:
              type: boolean
              description: |
                个性化排序开关。`true`（默认）= 列表检索允许 `sort=composite`（时效 40 / 距离 40 / 完整度 20 加权）；
                `false` = `sort=composite` 回落为 `distance`（仅按距离排序）。
                其余显式排序值（`publish_time`/`price_asc`/`price_desc`/`completeness`）不受本开关影响。
            ai_improve:
              type: boolean
              description: |
                AI 数据用于改进解析开关。`true`（默认）= 允许将你确认/修改后的发布字段去标识化后用于改进解析能力；
                `false` = 你的输入与结果仅用于完成当次解析，不入模型优化样本。

    SettingsUpdateRequest:
      type: object
      description: 局部更新设置（仅提交需变更字段；`null`/缺省字段不动）
      properties:
        notify:
          type: object
          description: 通知开关（各子字段缺省即不动）
          properties:
            enabled: { type: boolean }
            system: { type: boolean }
            interaction: { type: boolean }
            cert: { type: boolean }
        default_radius: { $ref: '#/components/schemas/RadiusEnum' }
        privacy:
          type: object
          description: 隐私项补丁（仅 `personalized_recommend` 与 `ai_improve` 可写；`contact_display` 提交即忽略）
          properties:
            personalized_recommend:
              type: boolean
              description: 个性化排序开关（`false` = 列表 `sort=composite` 回落 `distance`）
            ai_improve:
              type: boolean
              description: AI 数据用于改进解析开关（`false` = 输入与结果仅用于当次解析）

    # ---------- 分类与模板 ----------

    CategoryTree:
      type: object
      description: 分类树全量数据。三级结构 L1 → L2 → L3（叶子）
      required: [version, categories]
      properties:
        version: { $ref: '#/components/schemas/CategoryVersion' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategoryNode' }

    CategoryNode:
      type: object
      required: [id, name, level]
      properties:
        id:
          type: integer
          format: int32
          description: 类目 ID。L3 与 L2 满足 `l2_id = l3_id DIV 100`
          example: 10101
        name: { type: string, example: 水泥 }
        level:
          type: integer
          format: int32
          enum: [1, 2, 3]
          description: 层级。硬过滤层级见 NfrMatch.hardFilterCategoryLevel
        icon: { type: string, nullable: true }
        sensitive:
          type: boolean
          description: true 表示高敏类目，发布需先通过资质认证，否则回 40302
        banned:
          type: boolean
          description: true 表示当前禁止发布，发布回 40303
        children:
          type: array
          description: 子节点。L3 无 children
          items: { $ref: '#/components/schemas/CategoryNode' }

    CityItem:
      type: object
      description: 城市条目（定位兜底「手动选城市」数据源）
      required: [adcode, name, lat, lng]
      properties:
        adcode:
          type: string
          description: 行政区划代码（稳定标识）
          example: '330100'
        name: { type: string, example: 杭州 }
        lat:
          type: number
          format: double
          description: 城市中心纬度（GCJ-02）
          example: 30.2741
        lng:
          type: number
          format: double
          description: 城市中心经度（GCJ-02）
          example: 120.1551

    CitiesResponse:
      type: object
      description: 可选城市列表
      required: [cities]
      properties:
        cities:
          type: array
          items: { $ref: '#/components/schemas/CityItem' }

    Template:
      type: object
      description: 叶子类目发布模板，驱动客户端动态表单渲染
      required: [leaf_category_id, fields]
      properties:
        leaf_category_id: { type: integer, format: int32, example: 10101 }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TemplateField'}

    TemplateField:
      type: object
      required: [key, label, type, required]
      properties:
        key:
          type: string
          description: 字段键，落 `post.attributes` JSON 的一级键
          example: brand
        label: { type: string, example: 品牌 }
        type:
          type: string
          enum: [text, number, select, multi_select, date, datetime, route_pair]
          description: |
            字段控件类型。
            - `date`（2026-10-30 补注）：纯日期，不含时分；客户端当前降级为文本输入。
            - `datetime`（2026-10-30 新增，拼车「出发时间」）：值为 RFC3339 UTC
              时刻串（形如 `2026-10-30T10:30:00Z`），客户端渲染为时间选择控件。
            - `route_pair`（2026-10-30 新增，拼车「起点 → 终点」）的值为对象而非
              字符串：`{origin:{name,address,lng,lat}, destination:{...},
              distance_m?,duration_s?}`。
            其余类型为字符串。必填判定：`route_pair` 要求两端都带数值坐标
            （历史字符串形态按已填放行）；其余类型（含 `datetime`）非空即已填，
            历史文本同样放行。
        required:
          type: boolean
          description: |
            是否必填。**全部 required 字段填齐**即 `required_full=true`，
            是 `completeness_level` 三条件之一
        options:
          type: array
          description: 仅 select / multi_select 有值
          items: { type: string }
        unit: { type: string, nullable: true, example: 吨 }
        placeholder: { type: string, nullable: true }

    # ---------- 媒体 ----------

    UploadTicket:
      type: object
      description: OSS 直传票据。客户端拿到后直传 OSS，不经过应用服务器
      required: [media_id, upload_url, expire_at]
      properties:
        media_id:
          type: string
          description: 媒体 ID，**由服务端生成**，客户端不可指定
          example: mda_9c1f4e7b2a
        upload_url:
          type: string
          description: 带签名的短时效直传地址。客户端不持有任何长期密钥
        expire_at:
          type: string
          format: date-time
          description: 票据到期时间。24h 未 commit 的 pending 记录由定时任务清理

    MediaCommitResult:
      type: object
      required: [media_id, url, audit_status]
      properties:
        media_id: { type: string, example: mda_9c1f4e7b2a }
        url:
          type: string
          description: 带签名的临时访问地址（桶不开公共读）
        audit_status: { $ref: '#/components/schemas/AuditStatusEnum' }
        reject_reason:
          type: string
          nullable: true
          maxLength: 64
          description: 仅 audit_status=reject 且本人视角时下发

    MediaItem:
      type: object
      description: |
        帖子内的媒体项。他人视角只会出现 `audit_status=pass` 的项；
        本人视角可出现三态并携带 `reject_reason`。
      required: [media_id, url, audit_status]
      properties:
        media_id: { type: string }
        url: { type: string }
        audit_status: { $ref: '#/components/schemas/AuditStatusEnum' }
        reject_reason: { type: string, nullable: true }

    # ---------- 发布 ----------

    PostDraft:
      type: object
      description: |
        发布草稿载荷，用于 `/posts/precheck`。
        与 `PostCreateRequest` 字段一致但全部非必填（允许对半成品做预校验）。
      properties:
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32 }
        title: { type: string, maxLength: 40 }
        price:
          type: number
          format: double
          nullable: true
          description: 价格（元）。null/缺省表示「面议」（PRD §5.8 允许价格为空）
        price_unit:
          type: string
          nullable: true
          description: 价格单位，取模板 price_units 之一；price 为 null 时无意义
        description: { type: string, maxLength: 500 }
        attributes:
          type: object
          additionalProperties: true
          description: |
            动态属性，键取自模板 fields[].key，落 `post.attributes` JSON 列。
            `route_pair` 类型的字段（拼车「起点 → 终点」）值是对象而非字符串：
            `{origin:{name,address,lng,lat}, destination:{...}, distance_m?, duration_s?}`；
            历史数据的同名字段仍是字符串，读取端必须同时接受两种形态。
        lng: { type: number, format: double }
        lat: { type: number, format: double }
        address: { type: string, maxLength: 120 }
        address_precise:
          type: boolean
          description: |
            位置是否精确，`completeness_level` 三条件之一。
            模板含 `route_pair` 字段（拼车）时为「起点与终点都选到带坐标的 POI」；
            其余分类为「门牌号非空」。
        media_ids:
          type: array
          maxItems: 9
          items: { type: string }
        contact_type:
          type: string
          enum: [phone, wechat]
        contact_value: { type: string, maxLength: 64 }
        ai_assisted:
          type: boolean
          default: false
          description: |
            本条是否由 T2 AI 智能发布辅助生成（PRD §5.9）。`true` 时：
            ① 发布成功后在 `POST /posts` 扣 1 次 AI 配额；② 帖子详情页展示
            「AI 辅助生成」内容标识；③ 落 `post.ai_assisted` 列。
            **由「确认页点确认发布」置 `true`**；用户拒绝结果/手动填写为 `false`。

    SearchResolveRequest:
      type: object
      description: |
        语义搜索解析入参（`POST /search/resolve`）。至少一项文本/语音输入非空，否则回 40001。
        `voice_text` 优先于 `voice_media_id` / `voice_audio_base64`。
      properties:
        text:
          type: string
          nullable: true
          description: 文字输入（搜索框）
        voice_text:
          type: string
          nullable: true
          description: 客户端已转写的语音文本（优先使用）
        voice_media_id:
          type: string
          nullable: true
          description: 登录态语音媒体 ID（服务端签名后 ASR，转写成功即删）
        voice_audio_base64:
          type: string
          nullable: true
          description: 游客语音 base64（不落 OSS，上游转写即弃；上限见 NfrSearch）
        voice_content_type:
          type: string
          nullable: true
          description: 游客语音 MIME（缺省 `audio/mp4`，须在 NfrMedia.AUDIO_CONTENT_TYPES 内）
        anchor_lng:
          type: number
          format: double
          nullable: true
          description: 长按地图锚点经度（GCJ-02）
        anchor_lat:
          type: number
          format: double
          nullable: true
          description: 长按地图锚点纬度（GCJ-02）
        current_lng:
          type: number
          format: double
          nullable: true
          description: 当前定位经度（无地名、无长按时兜底）
        current_lat:
          type: number
          format: double
          nullable: true
          description: 当前定位纬度

    SearchResolveResult:
      type: object
      required:
        - leaf_category_ids
        - category_labels
        - price_excludes_negotiable
        - unresolved_fields
        - sources
        - query_text
        - ai_used
      properties:
        transcript: { type: string, nullable: true, description: 语音转写文本 }
        post_type:
          type: string
          nullable: true
          enum: [resource, demand]
          description: 供需方向（未表达为 null）
        leaf_category_ids:
          type: array
          description: 命中的叶子类目 ID 集合（空表示未收窄类目）
          items: { type: integer, format: int32 }
        category_labels:
          type: array
          description: 叶子类目显示名（与 ID 同序）
          items: { type: string }
        radius:
          type: string
          nullable: true
          enum: ['1', '3', '5', '10', city]
          description: 半径档（未表达为 null）
        radius_meters:
          type: integer
          nullable: true
          description: 真实半径米数（city 档为 null，前端按此画圈并精裁）
        anchor_lng: { type: number, format: double, nullable: true }
        anchor_lat: { type: number, format: double, nullable: true }
        anchor_name: { type: string, nullable: true, description: POI 命中时的地点名 }
        anchor_source:
          type: string
          nullable: true
          enum: [text, poi, long_press, current]
          description: 锚点来源
        community_id:
          type: string
          nullable: true
          description: |
            小区实体 ID（高德住宅区 POI ID）。高置信时自动采用，前端须原样
            透传给 `/map/pins?community_id=` 做「该小区」精确过滤。
        community_name:
          type: string
          nullable: true
          description: 小区规范名（回显用）
        community_candidates:
          type: array
          description: |
            低置信候选（最多 3 个）。非空且 `community_id` 为空时，前端须让用户点选；
            点选后带该候选的 `id` 作为 `community_id` 重新查询，并把锚点设为候选坐标。
          items:
            type: object
            properties:
              id: { type: string, description: 小区实体 ID }
              name: { type: string, description: 小区规范名 }
              district: { type: string, description: 所属区县 }
              lng: { type: number, format: double }
              lat: { type: number, format: double }
        price_min: { type: number, format: double, nullable: true, description: 价格下限（元） }
        price_max: { type: number, format: double, nullable: true, description: 价格上限（元） }
        price_excludes_negotiable:
          type: boolean
          description: 设置价格上限时面议（price IS NULL）被排除
        unresolved_fields:
          type: array
          description: 未敢采用/无法解析的字段名（前端灰态「没敢用」）
          items: { type: string }
        sources:
          type: object
          additionalProperties:
            type: string
            enum: [vocab, ai, poi, anchor, current]
          description: 槽位来源标记（字段名 → 来源）
        query_text: { type: string, description: 归一化后的解析输入 }
        ai_used: { type: boolean, description: 是否采用了 AI 解析结果（缓存命中也算 true） }
        degraded:
          type: boolean
          description: |
            AI 不可用/超时/输出非法，已降级为词表解析。前端可提示「AI 暂不可用，
            已按关键词理解」，不要把它当成解析失败。

    AiParseRequest:
      type: object
      description: |
        AI 智能发布解析入参（PRD §5.9 四模式共用）。
        **至少一项输入非空**：`media_id` / `voice_media_id` / `text` / `voice_text`。
      properties:
        media_id:
          type: string
          nullable: true
          description: 图片媒体 ID（模式①/④；须为本人已上传且过审的媒体）
        voice_media_id:
          type: string
          nullable: true
          description: |
            音频媒体 ID（模式②）。服务端走**已备案模型**（通义千问，备案覆盖含 ASR）
            做语音转写后再进 Scope 四步管线。
        voice_text:
          type: string
          nullable: true
          description: 客户端已转写的语音文本（可选；与 `voice_media_id` 二选一，本字段优先）
        text:
          type: string
          nullable: true
          description: 自由文本输入（模式③逐轮累积 / 模式④标题 / 模式①补充一句话）
        kind:
          $ref: '#/components/schemas/PostTypeEnum'
        leaf_category_id:
          type: integer
          format: int32
          nullable: true
          description: 当前已选叶子类目 ID，用于模板 scope（P 集合）
        completeness_level:
          type: integer
          format: int32
          nullable: true
          enum: [0, 1, 2]
          description: 当前草稿完整度档，用于回填本次解析后的配额快照（只读）

    AiParseResult:
      type: object
      required: [guess, unresolved_fields]
      properties:
        guess:
          $ref: '#/components/schemas/AiGuess'
        scope_verified:
          type: object
          additionalProperties:
            type: string
            enum: [user_input, neighbor_mode, platform]
          description: |
            每个**已注入**字段的来源（§5.10 Step 2 的 U/N/P 三集合），
            供确认页展示「据你已填 / 据附近同类 / 据分类模板」。
            键为字段名、值为来源枚举。**未列入的字段即未猜出**。
          example:
            title: user_input
            leaf_category_id: platform
            price: neighbor_mode
        unresolved_fields:
          type: array
          description: |
            Scope 四步管线判定**不一致或越界**而拒绝注入的字段（§5.10 Step 4），
            服务端**留空不猜**。确认页对列出的字段标「需你补充」。
          items: { type: string }
          example: [price, template_values.floor]
        quota:
          $ref: '#/components/schemas/AiQuota'
          description: 本次解析后的配额快照（只读展示；本端点不扣减）

    AiGuess:
      type: object
      description: |
        四件套猜测（PRD §5.9：标题 / 分类 / 价格 / 模板字段）。
        **未猜出的字段为 null 或缺省**（不用空串/0 表示「猜不出」）。
      properties:
        title: { type: string, nullable: true, description: 标题（需求态含 §7.4.3 前缀） }
        leaf_category_id: { type: integer, format: int32, nullable: true, description: 三级叶子类目 ID }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议或未猜出 }
        price_unit: { type: string, nullable: true, description: 价格单位；须取模板 price_units 之一 }
        template_values:
          type: object
          additionalProperties: true
          description: 模板字段猜测，键取自模板 `fields[].key`

    AiQuota:
      type: object
      required: [used, limit, reset_at]
      properties:
        used:
          type: integer
          format: int32
          description: 今日已用 AI 解析次数（仅「确认发布」计入，PRD §5.9）
        limit:
          type: integer
          format: int32
          description: 今日上限（实名状态 × 完整度档；高敏类目额外 +10）
        reset_at:
          type: string
          format: date-time
          description: 配额重置时间（次日 00:00，Asia/Shanghai）

    PostCreateRequest:
      allOf:
        - $ref: '#/components/schemas/PostDraft'
        - type: object
          required: [type, leaf_category_id, title, lng, lat, contact_type, contact_value]
          description: |
            正式发布载荷。派生字段
            （`l2_category_id` / `completeness_level` / `grid_id` / `expire_at` / `version`）
            **由服务端生成，客户端传了也被忽略**。
          properties:
            cert_ids:
              type: array
              uniqueItems: true
              items: { type: integer, format: int64 }
              description: |
                可选挂载的资质档案 ID 列表（一帖多证，2026-10-29 由 `cert_id` 扩展而来）。
                缺省或空数组 = 本次不展示，不阻断发布、不进 precheck 阻断项。
                只接受本人 `status=approved` 的资质，否则回 `40001`。
                写入时逐张冻结证名快照，之后换证不回溯；详情按挂载顺序展示全部证名。

    PostUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/PostDraft'
        - type: object
          required: [version, type, leaf_category_id, title, lng, lat]
          properties:
            version:
              type: integer
              format: int64
              description: |
                乐观锁版本号（须取自 `GET /posts/mine` 或 `GET /posts/{id}` 的 `version`）。
                不符、非本人、行不存在或非在架一律回 `40903`（0 行不区分成因）。
            cert_ids:
              type: array
              uniqueItems: true
              items: { type: integer, format: int64 }
              description: |
                编辑窗口「资质栏」的挂载结果，**整体替换**该帖现有声明（2026-10-29）。
                缺省 = 本次不改动；空数组 = 取消全部挂载。只接受本人 `status=approved`
                的资质，否则回 `40001`。声明写在不修改 `post` 行的独立表内，
                不影响 `version` / `updated_at` / `expire_at`。
          description: |
            [B2-8] 编辑载荷。字段集与 `PostCreateRequest` 一致，**但 `contact_type`/`contact_value`
            可空**——`contact_value` 为 `null` 表示**保留原密文不改**（完整联系方式明文唯一出口是
            `GET /posts/{id}/contact`，安全方案 §4.6 出口收敛；本接口不回显亦不要求重填）。

    RepostDraft:
      type: object
      description: |
        [B2-8] 克隆重发草稿载荷（PRD §8.4/§8.6）。服务端读取原帖返回**可编辑草稿**（**不落库**），
        前端带入发布页编辑态，用户确认后走 `POST /posts`。**不含完整联系方式**（只 `contact_type` + 脱敏 `contact_mask`）。
      required: [source_post_id, type, leaf_category_id, title, lng, lat, category_available]
      properties:
        source_post_id: { type: integer, format: int64, description: 原帖 ID }
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32 }
        title: { type: string }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议 }
        price_unit: { type: string, nullable: true }
        description: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: true
          description: 动态属性（原帖 `template_values` 反序列化）
        lng: { type: number, format: double }
        lat: { type: number, format: double }
        address: { type: string, nullable: true }
        address_precise: { type: boolean, nullable: true }
        media_ids:
          type: array
          items: { type: string }
        contact_type: { type: string, nullable: true, description: 原渠道（phone/wechat） }
        contact_mask: { type: string, nullable: true, description: 脱敏原联系方式（不回显明文） }
        category_available:
          type: boolean
          description: false = 原分类已被运营停用（PRD §8.7），前端须提示重选分类

    PrecheckResult:
      type: object
      required: [passed, blocks]
      properties:
        passed:
          type: boolean
          description: true 表示无阻断项，可直接提交发布
        blocks:
          type: array
          description: 全部阻断项一次性给全（不逐条打断用户）
          items:
            type: object
            required: [code, message]
            properties:
              code:
                type: integer
                format: int32
                description: 对应的错误码（40901/40902/40303/40302/40304）
              message: { type: string, description: 可直接呈现的中文提示 }
              field:
                type: string
                nullable: true
                description: 关联字段名，供客户端定位到具体表单项
        completeness_level:
          $ref: '#/components/schemas/CompletenessLevelEnum'
        derived:
          type: object
          description: 服务端预演算的派生值，供客户端提前展示完整度提示
          properties:
            required_full: { type: boolean }
            address_precise: { type: boolean }
            leaf_matched: { type: boolean }

    PostCredentialStateEnum:
      type: string
      description: |
        凭证状态。只有 `valid` 会返回 `PostCredential` 对象（详情页凭证块只显示证书名）；
        `revoked` / `deleted` 时整块不渲染，取值保留以备日志与统计口径。
        - `valid`：关联的资质有效
        - `revoked`：关联的资质被撤销
        - `deleted`：关联的资质已被用户删除
      enum: [valid, revoked, deleted]

    PostCredential:
      type: object
      description: |
        帖级凭证声明块（详情页资质栏的一项）。**证名取自写入时的冻结快照，永不改写**。
        详情只显示证书名；凭证被删除或撤销时不返回该项（整项不渲染）。
      required: [cert_id, cert_name, state]
      properties:
        cert_id:
          type: integer
          format: int64
          nullable: true
          description: 资质档案 ID（供编辑态回显勾选；凭证被删除后历史行可为 `null`）
        cert_name:
          type: string
          maxLength: 64
          description: 证名快照；历史行可能为空串
        image_url:
          type: string
          nullable: true
          description: |
            证照图只读签名 URL（2026-10-29 用户裁定：详情页展示缩略图并可点开大图，暂不打码）。
            未上传证照、或媒体行已被清理时为 `null`，客户端按无图渲染。
            签名为公开只读（详情页游客可见），有效期由对象存储签名策略决定。
        state: { $ref: '#/components/schemas/PostCredentialStateEnum' }

    PostDetail:
      type: object
      description: |
        帖子详情。**出参必带 `version`**（供 `PATCH /posts/{id}/status` 乐观锁入参）。
        **不含完整联系方式**，仅 `contact_mask`；完整值只由
        `GET /posts/{id}/contact` 返回。
      required: [id, type, leaf_category_id, l2_category_id, title, status, version, completeness_level]
      properties:
        id: { type: integer, format: int64, example: 1001 }
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32, example: 10101 }
        l2_category_id:
          type: integer
          format: int32
          description: STORED 生成列 `leaf_category_id DIV 100`，不可写
          example: 101
        category_path:
          type: array
          description: 类目面包屑名称，L1 → L2 → L3
          items: { type: string }
        title: { type: string }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议 }
        price_unit: { type: string, nullable: true, description: 价格单位；price 为 null 时无意义 }
        description: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: true
          description: 动态属性，来自 `post.attributes` JSON 列
        lng: { type: number, format: double, description: GCJ-02，5 位小数 }
        lat: { type: number, format: double, description: GCJ-02，5 位小数 }
        address: { type: string, nullable: true }
        distance_m:
          type: integer
          format: int32
          nullable: true
          description: 与请求方视野中心的距离（米）
        media:
          type: array
          description: 他人视角仅含 audit_status=pass 的项
          items: { $ref: '#/components/schemas/MediaItem' }
        contact_mask:
          type: string
          nullable: true
          description: |
            发布时落库的脱敏联系方式（`post.contact_mask`，[147] DEC-13）。由发布端
            **明文派生**、非密文回解，故不破坏「解密唯一入口在 contact 域」这一红线；
            完整明文仍只由 `GET /posts/{id}/contact` 返回。**可空**：存量行（迁移前发布）
            为 `null`，客户端须按可空处理。
          example: 138****8000
        completeness_level: { $ref: '#/components/schemas/CompletenessLevelEnum' }
        ai_assisted:
          type: boolean
          description: |
            本条是否由 T2 AI 智能发布辅助生成（PRD §5.9 裁定「最终帖子详情页标
            『AI 辅助生成』」）。**存量行为 `false`**（迁移前发布），客户端按可空/默认 false 处理。
        status: { $ref: '#/components/schemas/PostStatusEnum' }
        publish_at: { type: string, format: date-time }
        expire_at:
          type: string
          format: date-time
          description: 到期时间。倒计时文案允许用本地时间计算
        version:
          type: integer
          format: int64
          description: 乐观锁版本号。**PATCH status 时必须原样回传**
        favorited:
          type: boolean
          nullable: true
          description: |
            当前登录用户是否已收藏。**登录用户恒返回 `true`/`false`**；
            游客无收藏身份，返回 `null`（客户端按「可收藏的空心态」处理）。
            不下发收藏数：计数仅帖主可见（PRD §8.3.1）。
        author:
          $ref: '#/components/schemas/AuthorBrief'
        credentials:
          type: array
          items:
            $ref: '#/components/schemas/PostCredential'
          description: |
            帖级凭证声明块列表（一帖多证，2026-10-29）。按挂载顺序返回全部**当前有效**的
            证名快照；未关联凭证、或全部凭证均已删除/撤销时为空数组，客户端整栏不渲染。

    AuthorBrief:
      type: object
      description: |
        作者摘要，严格遵循 `user` 对外视图白名单。
        `phone_mask` / `real_name_enc` / `id_card_hash` **不出现**。
      required: [id, nickname, realname_status]
      properties:
        id: { type: integer, format: int64 }
        nickname: { type: string }
        avatar_url: { type: string, nullable: true }
        realname_status: { $ref: '#/components/schemas/RealnameStatusEnum' }
        qualification_badges:
          type: array
          items: { type: string }

    MyPostItem:
      type: object
      description: 我的帖子列表项。**必带 `version`**；本人视角下发媒体三态
      required: [id, type, title, status, version, completeness_level]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32 }
        title: { type: string }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议 }
        price_unit: { type: string, nullable: true, description: 价格单位；price 为 null 时无意义 }
        cover_media:
          $ref: '#/components/schemas/MediaItem'
        completeness_level: { $ref: '#/components/schemas/CompletenessLevelEnum' }
        status: { $ref: '#/components/schemas/PostStatusEnum' }
        publish_at: { type: string, format: date-time }
        expire_at: { type: string, format: date-time }
        view_count:
          type: integer
          format: int64
          description: |
            浏览数，来自 `post_view_daily` 聚合。仅帖主可见，不对外展示、不参与排序。
            口径：按人/天去重、排除作者本人、功能上线后从 0 起算。
        favorite_count:
          type: integer
          format: int64
          description: |
            收藏数，来自 `favorite` 聚合。仅帖主可见，不对外展示、不参与排序。
            口径：排除作者自收藏。
        contact_count:
          type: integer
          format: int64
          description: 被查看联系方式的次数，来自 contact_event 聚合
        version: { type: integer, format: int64 }

    PostCard:
      type: object
      description: 列表卡片项（`/posts/search`）。不含完整联系方式
      required: [id, type, title, completeness_level]
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32 }
        l2_category_id: { type: integer, format: int32 }
        title: { type: string }
        summary: { type: string, nullable: true, description: 描述摘要 }
        cover_url: { type: string, nullable: true, description: 仅 audit_status=pass 的封面 }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议。PRD §6.4.3 要求列表卡片展示价格，故下发 }
        price_unit: { type: string, nullable: true, description: 价格单位（取模板 price_units 之一）；price 为 null 时无意义 }
        lng: { type: number, format: double }
        lat: { type: number, format: double }
        distance_m: { type: integer, format: int32, nullable: true }
        completeness_level: { $ref: '#/components/schemas/CompletenessLevelEnum' }
        publish_at: { type: string, format: date-time }
        author: { $ref: '#/components/schemas/AuthorBrief' }

    FavoriteResult:
      type: object
      description: 收藏 / 取消收藏结果（幂等写，返回操作后的状态）
      required: [favorited]
      properties:
        favorited:
          type: boolean
          description: true=已收藏（POST 收藏），false=已取消（DELETE 取消）

    FavoriteItem:
      type: object
      description: |
        我的收藏列表项：他人视角的帖子卡 + 收藏时间。媒体只出 `audit_status=pass`
        的封面；不含完整联系方式。列表按 `favorite_at` 倒序。
      required: [post_id, type, title, completeness_level, status, favorite_at]
      properties:
        post_id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/PostTypeEnum' }
        leaf_category_id: { type: integer, format: int32 }
        l2_category_id: { type: integer, format: int32 }
        category_path:
          type: array
          nullable: true
          description: 类目面包屑名称（L1 → L2 → L3，由 post 域 `CategoryService` 拼，2026-10-11 补，与 `PostDetail.category_path` 同型）；未知类目为空数组
          items: { type: string }
        title: { type: string }
        price: { type: number, format: double, nullable: true, description: 价格（元）；null=面议。PRD §8.3.2 卡片展示 }
        price_unit: { type: string, nullable: true, description: 价格单位；price 为 null 时无意义 }
        cover_media: { $ref: '#/components/schemas/MediaItem' }
        completeness_level: { $ref: '#/components/schemas/CompletenessLevelEnum' }
        status: { $ref: '#/components/schemas/PostStatusEnum' }
        publish_at: { type: string, format: date-time }
        favorite_at: { type: string, format: date-time, description: 收藏时间（列表排序键） }

    FavoritesResponse:
      type: object
      description: 我的收藏分页响应（`GET /favorites` 的 `data`）
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FavoriteItem' }
        total: { type: integer, format: int64 }
        page: { type: integer, format: int32 }
        page_size: { type: integer, format: int32 }

    NotificationReadRequest:
      type: object
      description: 标记通知已读请求体；`ids` 缺省或空数组 = 标记全部未读为已读
      properties:
        ids:
          type: array
          description: 待标记的通知 ID；缺省或空数组表示「全部未读」
          items: { type: integer, format: int64 }

    NotificationReadResult:
      type: object
      description: 标记通知已读结果
      required: [updated]
      properties:
        updated:
          type: integer
          format: int32
          description: 实际置为已读的行数（幂等：无未读行可标记时回 0）

    # ---------- 地图（紧凑格式） ----------

    PinsCompactResponse:
      type: object
      description: |
        地图图钉响应。为压体积采用 **schema + 二维数组** 的紧凑格式，
        而非常规对象数组。客户端按 `schema` 声明的列序解析 `pins`。

        `pins` 每行列序**固定**为：
        `["id", "lng", "lat", "category_id", "type", "completeness_level"]`

        - `type`：`0` = resource（资源），`1` = demand（需求）
        - `completeness_level`：`0` / `1` / `2`
        - 坐标位数见 `NfrPerf.mapPinCoordDecimals`
        - `pins` 条数上限见 `NfrPerf.renderMaxPins`
      required: [mode, total]
      properties:
        mode:
          type: string
          enum: [pin, cluster]
          description: |
            聚合模式，按 zoom 换算的 metersPerPixel 决定（**不按点数**），
            阈值见 `NfrPerf.clusterModeSwitchMetersPerPixel`。
            `pin` 时 `pins` 有值、`cluster` 时 `clusters` 有值。
        schema:
          type: array
          description: pins 的列序声明，固定 6 列
          items: { type: string }
          example: [id, lng, lat, category_id, type, completeness_level]
        pins:
          type: array
          description: 紧凑二维数组，仅 mode=pin 时有值
          items:
            type: array
            minItems: 6
            maxItems: 6
            items:
              oneOf:
                - type: integer
                - type: number
          example:
            - [1001, 120.15012, 30.28034, 10101, 0, 2]
            - [1002, 120.14887, 30.27991, 10102, 1, 1]
        clusters:
          type: array
          description: 服务端预聚合结果，仅 mode=cluster 时有值
          items:
            type: object
            required: [lng, lat, count]
            properties:
              lng: { type: number, format: double }
              lat: { type: number, format: double }
              count: { type: integer, format: int32, description: 该聚合点包含的帖子数 }
              category_id:
                type: integer
                format: int32
                nullable: true
                description: 聚合内主导类目，用于图标着色
        total:
          type: integer
          format: int32
          description: 命中总数（可能大于返回条数上限）
        category_version_stale:
          type: boolean
          description: |
            true 表示客户端 `category_version` 已过期。
            客户端须**异步**拉 `/categories/tree` 并清空全部本地 Pin 缓存。
            **不阻塞本次渲染、不强升、不回 40001。**

    # ---------- 联系 ----------

    ContactInfo:
      type: object
      description: |
        完整联系方式。**全系统唯一出口**。
        解密由 `common` 域统一入口执行（AAD 绑定 `post_id`）。
        返回成功即已写 `contact_event`（北极星辅助指标唯一统计点）与 `audit_log`。
      required: [contact_type, contact_value, remaining_today]
      properties:
        contact_type:
          type: string
          enum: [phone, wechat]
        contact_value:
          type: string
          description: 解密后的完整联系方式
          example: '13800138000'
        remaining_today:
          type: integer
          format: int32
          description: |
            今日剩余可查看次数，**仅账号维度**，用于前置提示。

            ### 客户端不得把它当成承诺

            服务端限频有**四个维度**（账号 / 设备 / IP / 熔断），本字段只反映其中一个。
            因此下面这个场景是**正常且必然会发生**的：

            ```
            本字段返回 3，UI 显示「今日还可查看 3 次」
            用户点第 2 次 → 服务端因【设备维度】超限返 42902
            UI 只能说「已达上限」→ 应用当场自我否定
            ```

            **UI 文案规则：**

            - 用「今日剩余 N 次（以实际请求结果为准）」，**不用**「今日还可查看 N 次」；
            - 收到 `42902` 后**立即把本地显示的剩余次数刷成 0**，否则「还剩 3 次」与
              「已达上限」会同时出现在屏幕上；
            - 提示文案**不解释是哪个维度超限**（服务端刻意不区分，风控信息不外泄），
              只按 `Retry-After` 展示倒计时。

            **服务端不改为四维最小值**：那会把设备维度的限额直接暴露给客户端，
            可被反推出风控阈值，得不偿失。正确解法是客户端不把它当承诺。
        post_id: { type: integer, format: int64 }

    # ---------- 通知 ----------

    Notification:
      type: object
      required: [id, type, title, is_read, created_at]
      properties:
        id: { type: integer, format: int64 }
        type:
          type: string
          enum: [system, interaction, cert]
          description: 与 `notification.type` 列枚举严格一致
        title: { type: string }
        content: { type: string, nullable: true }
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
        target:
          type: object
          nullable: true
          description: 跳转目标，供客户端路由
          properties:
            kind:
              type: string
              enum: [post, cert, none]
            post_id: { type: integer, format: int64, nullable: true }

    # ---------- 埋点 ----------

    TrackEvent:
      type: object
      description: |
        埋点事件。四必埋事件：
        `layer_switch`（Batch1）、`post_published`（Batch1）、`contact_event`（Batch1）、
        `demand_push_sent` + `resource_detail_click`（Batch2）。

        另有 `amap_degraded`（高德 Web 服务降级，props 仅 `{reason}`：`no_key` /
        `timeout` / `http_error` / `parse` / `network`），客户端**每次进入起终点
        选择页最多一条**，避免随按键重复触发造成同毫秒去重冲突。

        `ts` 取**客户端采集时刻**；服务端按 `ts` 归入 `track_event_YYYYMM` 月表。

        **`interaction_id` + `event` + `ts` 三者同时是去重键成员**
        （连同登录态推出的 `user_id`，构成埋点库唯一索引 `uk_event_dedup`）。
        因此这三个字段在同一事件的重传中必须**逐字不变** —— 客户端一旦对已入队
        事件做任何"补全"或重新取值，重传就会被判为新事件而重复落库。
      required: [event, ts, interaction_id]
      properties:
        event:
          type: string
          enum: [layer_switch, post_published, contact_event, demand_push_sent, resource_detail_click, amap_degraded]
        ts:
          type: string
          format: date-time
          description: |
            客户端采集时刻（不是上报时刻），决定月表归属。

            **必须带毫秒精度**：去重键 `uk_event_dedup` 的时间列是 `DATETIME(3)`，
            若只到秒，同一交互内 1 秒中的多次同名事件会被误判为重复而丢弃。
        interaction_id:
          type: string
          description: |
            与请求头 `X-Interaction-Id` 对应，用于串联同一次交互。

            **本接口是唯一「请求体该字段与请求头不同值」的场景**：请求头是批次级的
            「这次传输动作」，本字段是事件所属的原始交互，两者互不覆盖。

            去重键成员，重传时必须逐字不变。
        request_id:
          type: string
          nullable: true
          description: |
            服务端请求标识。**缓存命中时不存在**，属预期行为，
            不得因缺失判为异常。
        props:
          oneOf:
            - $ref: '#/components/schemas/LayerSwitchProps'
          description: 事件属性。layer_switch 使用 LayerSwitchProps，其余事件属性 Batch2 补充
          additionalProperties: true

    LayerSwitchProps:
      type: object
      description: |
        `layer_switch` 事件的 12 个属性（可观测性架构方案 §4.1.1）。

        **四段耗时纪律**：`t_cache_ms + t_net_ms + t_agg_ms + t_render_ms == duration_ms`
        （容差 ±1ms）。四段必须**各自独立打点计时**，
        **禁止用总时长减法**倒推任何一段。
      required: [duration_ms, t_cache_ms, t_net_ms, t_agg_ms, t_render_ms, result, cache_hit]
      properties:
        duration_ms:
          type: integer
          format: int32
          description: 图层切换总耗时。目标见 NfrPerf.layerSwitchP95Ms
        t_cache_ms: { type: integer, format: int32, description: 缓存读取段耗时（独立计时） }
        t_net_ms: { type: integer, format: int32, description: 网络请求段耗时（独立计时） }
        t_agg_ms: { type: integer, format: int32, description: 聚合计算段耗时（独立计时） }
        t_render_ms: { type: integer, format: int32, description: 渲染段耗时（独立计时） }
        result:
          type: string
          enum: [success, fail]
        fail_reason:
          type: string
          nullable: true
          enum: [timeout, network, server_error, render_error, cancelled]
          description: 仅 result=fail 时有值
        err_code:
          type: integer
          format: int32
          nullable: true
          description: 失败时的业务 code（见错误码表）
        cache_hit:
          type: boolean
          description: 是否命中本地 Pin 缓存。命中时 request_id 不存在
        fps: { type: number, format: float, nullable: true, description: 该次交互期间平均帧率 }
        mem_peak_mb:
          type: number
          format: float
          nullable: true
          description: |
            峰值内存（MB）。Android 走平台通道采集，
            **iOS 上报空值**（不为此引入第三方库）。
        network_type:
          type: string
          enum: [wifi, 5g, 4g, 3g, 2g, none, unknown]

