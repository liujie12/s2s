      responses:
        '200':
          description: |
            成功。`data` 为 `null` 时表示版本未变（304 语义），客户端沿用本地缓存。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        nullable: true
                        allOf:
                          - $ref: '#/components/schemas/CategoryTree'
