      summary: 确认媒体上传完成（两步式第 2 步）
      operationId: commitMedia
      x-batch: Batch1
      x-domain: post
      description: |
        ### `audit_status` 三态双视角

        | 状态 | 本人视角 | 他人视角 |
        | --- | --- | --- |
        | `pending` | 展示「审核中」，**允许提交发布** | **不下发** |
        | `pass` | 正常展示 | 正常展示 |
        | `reject` | 可见 `reject_reason`，可替换重传 | **不下发** |

        **硬规则**：`audit_status != pass` 的 `media_id`
        不得出现在任何**非本人**可见的响应中。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: media_id
          in: path
          required: true
          schema: { type: string, example: mda_9c1f4e7b2a }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaCommitResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/precheck:
    post:
      tags: [post]
      summary: 发布前置校验（不落库）
      operationId: precheckPost
      x-batch: Batch1
      x-domain: post
      description: |
        在用户点击「发布」之前提前暴露阻断项，避免填完长表单才报错。
        校验项与 `POST /posts` 完全一致但**不写库**：
        敏感词（`40901`）、图片过审（`40902`）、类目禁发（`40303`）、
        高敏类目资质（`40302`）、未实名发布上限（`40304`）。

        校验通过时 `data.passed=true`；发现问题时**仍返回 200 + code=0**，
        由 `data.blocks[]` 列出全部阻断项（一次性给全，不逐条打断用户）。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostDraft'
      responses:
        '200':
          description: 校验完成（通过或存在阻断项均为 200/code=0）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PrecheckResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts:
    post:
      tags: [post]
      summary: 发布帖子（资源或需求）
      operationId: createPost
      x-batch: Batch1
      x-domain: post
      description: |
        ### 落库派生字段（客户端不可传，传了也被忽略）

        | 字段 | 派生方式 |
        | --- | --- |
        | `l2_category_id` | STORED 生成列 `leaf_category_id DIV 100` |
        | `completeness_level` | STORED 生成列，由 `required_full` / `address_precise` / `leaf_matched` 三条件达成数映射：3→2、2→1、其他→0 |
        | `grid_id` | 服务端按 0.0045° 步长算法计算 |
        | `expire_at` | 发布时间 + 有效天数（见 lib/nfr_constants.dart NfrPostLifecycle.validDays） |
        | `version` | 初始 0 |

        ### 联系方式加密

        `contact_value` 落库为双列范式：
        `contact_hash`（HMAC-SHA256 + pepper，`BINARY(32)`，承载等值查询）+
        `contact_value_enc`（AES-GCM-256 + 随机 IV，`VARBINARY`，AAD 绑定 `post_id`）。
        **本接口响应中不回显 `contact_value`**；完整联系方式只由
        `GET /posts/{id}/contact` 返回。

        成功后异步产出埋点事件 `post_published`。

        **B2-6a 身份门禁**：当前账号未绑定手机号（`phone_bound=false`）→ `40302`，
        客户端引导完成 `POST /auth/phone/bind`。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCreateRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/{post_id}:
    get:
      tags: [post]
      summary: 获取帖子详情
      operationId: getPostDetail
      x-batch: Batch1
      x-domain: post
      security: []
      description: |
        ### 未登录可只读访问（口径以 PRD §12.3 为准）

        本接口 `security: []`，未登录可只读查看详情。**注意与
        `/posts/{id}/contact` 区分**：后者未登录一律 `40101`，本接口不是。

        ### 未登录详情浏览限频（`42907`）

        因 PRD §14.3 已裁定**不做坐标模糊化**，本接口返回的 `address`
        含门牌号，若未登录不限频则精确住址可零成本批量采集。故未登录访问
        按**设备维每日 ≤30 次、IP 维每日 ≤100 次**（沿用 §7.7 联系方式的
        设备/IP 维阈值，非新增数字），任一超限返 `42907` + `Retry-After`。
        已登录用户不受此限。

        ### 出参必带 `version`

        用于 `PATCH /posts/{id}/status` 的乐观锁入参。

        ### 未实名详情浏览额度（`40301`）

        PRD §12.3 规定已登录未实名用户每日放行 5 条、第 6 条回 `40301`。

        **Batch1 该额度关闭**：由 `system_config.detail_quota_enabled` 开关控制，
        Batch1 置 `off`。原因是 `cert` 域整体延后导致全员
        `realname_status='none'`，额度生效会把「地图→详情→联系」P0 闭环卡死。
        服务端代码路径完整实现、仅由开关短路；Batch2 实名上线时置 `on`。

        ### 状态

        已下架或已过期回 `41001`；本人查看自己的帖子不受此限。
      parameters:
