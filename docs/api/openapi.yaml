      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/{post_id}:
    get:
      tags: [post]
      summary: 获取帖子详情
      operationId: getPostDetail
      x-batch: Batch1
      x-domain: post
      security: []
      description: |
        ### 未登录可只读访问（口径以 PRD §12.3 为准）

        本接口 `security: []`，未登录可只读查看详情。**注意与
        `/posts/{id}/contact` 区分**：后者未登录一律 `40101`，本接口不是。

        ### 未登录详情浏览限频（`42907`）

        因 PRD §14.3 已裁定**不做坐标模糊化**，本接口返回的 `address`
        含门牌号，若未登录不限频则精确住址可零成本批量采集。故未登录访问
        按**设备维每日 ≤30 次、IP 维每日 ≤100 次**（沿用 §7.7 联系方式的
        设备/IP 维阈值，非新增数字），任一超限返 `42907` + `Retry-After`。
        已登录用户不受此限。

        ### 出参必带 `version`

        用于 `PATCH /posts/{id}/status` 的乐观锁入参。

        ### 未实名详情浏览额度（`40301`）

        PRD §12.3 规定已登录未实名用户每日放行 3 条、第 4 条回 `40301`。

        **Batch1 该额度关闭**：由 `system_config.detail_quota_enabled` 开关控制，
        Batch1 置 `off`。原因是 `cert` 域整体延后导致全员
        `realname_status='none'`，额度生效会把「地图→详情→联系」P0 闭环卡死。
        服务端代码路径完整实现、仅由开关短路；Batch2 实名上线时置 `on`。

        ### 状态

        已下架或已过期回 `41001`；本人查看自己的帖子不受此限。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PostDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
    patch:
      tags: [post]
      summary: 编辑帖子内容
      operationId: updatePost
      x-batch: Batch2
      x-domain: post
      description: 占位。Batch2 交付，同样以 version 做乐观锁。
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200': { description: 占位，Batch2 交付 }

  /posts/{post_id}/status:
    patch:
      tags: [post]
      summary: 变更帖子状态（下架 / 重新上架 / 延期）
      operationId: updatePostStatus
      x-batch: Batch1
      x-domain: post
      description: |
        ### 乐观锁强约束

        - 入参**必须携带 `version`**；缺失回 `40001`，**服务端不得兜底**
          （不允许「不传就跳过版本校验」）
        - 更新语句形如 `UPDATE post SET ... WHERE id=? AND version=?`
        - 影响行数为 0 → 回 `40903`，客户端必须强制重取详情后由用户重试

        ### 写守卫分流

        | 变更来源 | 守卫条件 |
        | --- | --- |
        | 用户意图变更（本接口） | 守 `version`（乐观锁） |
        | 系统派生变更（定时任务到期下架等） | 守 `status IN (合法前驱集)`，不守 `version` |
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, version]
              properties:
                action:
                  type: string
                  enum: [offline, republish, renew]
                  description: |
                    - `offline`：下架（active → offline）
                    - `republish`：重新上架（offline → active，重算 expire_at）
                    - `renew`：延期（active → active，顺延 expire_at）
                version:
                  type: integer
                  format: int64
                  description: 从 GET 详情或 GET /posts/mine 取得的当前版本号。**缺失回 40001**
      responses:
        '200':
          description: 变更成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id: { type: integer, format: int64 }
                          status: { $ref: '#/components/schemas/PostStatusEnum' }
                          expire_at: { type: string, format: date-time }
                          version:
                            type: integer
                            format: int64
                            description: 变更后的新版本号
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalError' }

