  # ===========================================================================
  # 分组五：首页地图与列表（共 2 个接口，全部 Batch1）—— 全系统性能最敏感路径
  # ===========================================================================

  /map/pins:
    get:
      tags: [map]
      summary: 拉取地图图钉集合（紧凑数组格式）
      operationId: getMapPins
      x-batch: Batch1
      x-domain: map
      description: |
        ### 缓存键五要素（任一缺失回 `40001`）

        1. 分类 ID（`category_ids`）
        2. 供需态（`post_type`）
        3. 半径档（`radius`）
        4. 约 500m 坐标网格（`grid_id`）
        5. 数据版本号（`category_version`）

        服务端 Pin 集合缓存 TTL 见 `NfrCache.pinSetTtlSec`；
        客户端单设备缓存键上限见 `NfrCache.maxKeys`，按 LRU 淘汰。

        ### `grid_id` 算法（客户端 / 服务端 / SQL 三方逐位一致）

        - 步长 `0.0045°`（约 500m），原点 `(0, 0)`
        - 取整用 `floor`（**向负无穷**，不是截断）
        - 编码 `"{gx}_{gy}"`，存储类型 `varchar(24)`
        - 精度先向下取整到 5 位小数：`floor(x * 100000) / 100000`
        - 实现走**整数微度域**（避免浮点误差）
        - 入参正则 `^-?\d+_-?\d+$`，不符回 `40001`

        测试向量（10 条，三端共用）：

        | 输入 (lng, lat) | 期望 grid_id |
        | --- | --- |
        | (120.15000, 30.28000) | `26700_6728` |
        | (0, 0) | `0_0` |
        | (0.00450, 0.00450) | `1_1` |
        | (0.00449, 0.00449) | `0_0` |
        | (-0.00001, -0.00001) | `-1_-1` |
        | (-0.00450, -0.00450) | `-1_-1` |
        | (-0.00451, -0.00451) | `-2_-2` |
        | (0.004500049, 0.004500049) | `1_1` |
        | (-0.000015, -0.000015) | `-1_-1`（关键探针，须断言中间值） |
        | (120.15000, -30.28000) | `26700_-6729` |

        ### 聚合模式切换

        按 `zoom` 换算的 metersPerPixel 决定（**不按点数**），
        阈值见 `NfrPerf.clusterModeSwitchMetersPerPixel`：

        - 远景 → `mode=cluster`，服务端预聚合返回 `clusters[]`
        - 近景 → `mode=pin`，返回 `pins[]`，由客户端 Dart 侧做视觉聚合

        ### 响应体积与性能红线

        - `pins` 上限见 `NfrPerf.renderMaxPins`
        - gzip 后 ≤ `NfrPerf.mapPayloadMaxBytes`，原始 ≤ `NfrPerf.mapPayloadMaxRawBytes`
        - 坐标保留位数见 `NfrPerf.mapPinCoordDecimals`
        - 查询走 `post` 表 10 列覆盖索引 `idx_pins_cover`
          （前 5 列过滤 + 后 5 列即响应字段，`EXPLAIN` 须为 `Using where; Using index`）
        - 客户端读取超时对本接口**收紧至 3 秒**（其余接口 10 秒）

        ### 分类树版本协商

        `category_version` 与服务端不一致时**不报错**，响应附
        `category_version_stale: true`；客户端异步拉 `/categories/tree`
        并**清空全部本地 Pin 缓存**。不阻塞、不强升、不回 `40001`。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - name: category_ids
          in: query
          required: true
          description: 分类 ID 列表（缓存键要素 1）。缺失回 40001
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: integer, format: int32 }
          example: '10101,10102'
        - name: post_type
          in: query
          required: true
          description: 供需态（缓存键要素 2）。缺失回 40001
          schema: { $ref: '#/components/schemas/PostTypeEnum' }
        - name: radius
          in: query
          required: true
          description: 半径档（缓存键要素 3）。缺失回 40001
          schema: { $ref: '#/components/schemas/RadiusEnum' }
        - name: grid_id
          in: query
          required: true
          description: 约 500m 坐标网格（缓存键要素 4）。正则不符回 40001
          schema: { $ref: '#/components/schemas/GridId' }
        - name: category_version
