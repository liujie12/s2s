  # ===========================================================================
  # 分组四：T2 AI 智能发布（共 2 个接口，Batch1 覆盖 0 个）
  # 2026-10-13 裁定：以 PRD §5.9/§5.10 + §2302 两端点为准；
  # 原占位 `/ai/parse` + `/ai/ocr` 作废（OCR 非 §5.9 主路径，随语音模式一并撤下）。
  # ===========================================================================

  /ai/publish/parse:
    post:
      tags: [ai]
      summary: AI 智能发布解析（图/语音/文本 → 四件套猜测）
      operationId: aiPublishParse
      x-batch: Batch2
      x-domain: ai
      description: |
        ### 严格 Scope 四步管线（PRD §5.10）

        `U ∪ N ∪ P` Scope 提取 → 大模型生成（prompt 限死「仅用 scope 字段」）
        → 逆向比对；越界字段**留空并移入 `unresolved_fields[]`**，
        服务端**不猜、不编造**（PRD §5.9/§2302 红线）。

        ### 四模式共用本端点（PRD §5.9）

        | 模式 | 输入 |
        | --- | --- |
        | ① 多媒体 7 秒 | `media_id`（图片）+ 可空 `text` |
        | ② 语音零键盘 | `voice_media_id`（音频，服务端走已备案模型 ASR） |
        | ③ 对话式一问一答 | `text` / `voice_text`（逐轮累积） |
        | ④ 抢发 | 仅 `media_id` + `text`（标题） |

        ### 配额

        本端点**只读配额、不扣减**（PRD §5.9「仅确认发布才计 1 次」）；
        扣减点在 `POST /posts`（请求带 `ai_assisted=true`）。
        配额已耗尽回 `42901`（携带 `Retry-After`）；**解析失败不计配额**。

        ### 失败

        上游超时 / 无返回 / 图不可识别 → `50301`；客户端须保留已输入内容。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiParseRequest'
      responses:
        '200':
          description: 解析完成（同步返回四件套猜测）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AiParseResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /ai/publish/quota:
    get:
      tags: [ai]
      summary: 查询今日 AI 配额
      operationId: aiPublishQuota
      x-batch: Batch2
      x-domain: ai
      description: |
        返回今日已用 / 上限 / 重置时间（PRD §5.8 二维配额表）。

        **上限**按「实名状态 × 完整度档」动态计算：实名+🟢=20、实名+🟡=10、
        未实名或🔴=3；高敏类目额外 +10。**只读，不扣减。**

        **档位来源（2026-10-14 裁定）**：由客户端传入**当前草稿**的
        `completeness_level` 与 `leaf_category_id`；缺省视为最保守档（`0`=🔴）。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - name: completeness_level
          in: query
          required: false
          schema:
            type: integer
            format: int32
            enum: [0, 1, 2]
            default: 0
          description: 当前草稿完整度档（0=🔴 / 1=🟡 / 2=🟢）；缺省 0
        - name: leaf_category_id
          in: query
          required: false
          schema:
            type: integer
            format: int32
          description: 当前叶子类目 ID，用于判定高敏类目（+10）
      responses:
        '200':
          description: 配额查询成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AiQuota'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 分组五：首页地图与列表（共 2 个接口，全部 Batch1）—— 全系统性能最敏感路径
  # ===========================================================================

  /search/resolve:
    post:
      tags: [search]
      summary: 语义搜索解析（文字/语音 → 槽位卡）
      operationId: resolveSearch
      x-batch: Batch2
      x-domain: search
      security: []
      description: |
        ### 口径

        用户用一句话（文字或语音）表达需求，服务端解析成**槽位卡**：供需方向、
        叶子类目集合、半径档、地点锚点、价格上下限。前端据此维护「生效条件」：
        范围/供需/分类/价格为持久条件，地点与小区随本次搜索存在；解析出的价格
        会镜像进持久条件（见 PRD §6.4.1）。

        ### 两层解析（确定性优先）

        1. **确定性词表短路**：同义词/拼音、半径（数字+单位）、价格（含中文数字）、
           供需意图。命中即返回，**不出网、不扣 AI 费用**，同一句话结果确定。
        2. **AI 严格 Scope 兜底**：仅当确定性层一个槽位都没命中时调用；越界字段
           不采用并进 `unresolved_fields`。

        ### 游客与语音

        本接口游客可访问（`security: []`）。登录用户语音走 `voice_media_id`
        （服务端签名只读 URL 后 ASR）；游客语音走 `voice_audio_base64`（data URI
        直传上游，不落 OSS、不建媒体记录，转写即弃）。`voice_text` 优先于两者。

        ### 幂等

        请求须带 `Idempotency-Key`（与匿名写接口同口径，见公共参数），
        同一次解析重试不重复打上游。
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/XInteractionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchResolveRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/SearchResolveResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /map/pins:
    get:
      tags: [map]
      summary: 拉取地图图钉集合（紧凑数组格式）
      operationId: getMapPins
      x-batch: Batch1
      x-domain: map
      description: |
        ### 缓存键五要素（任一缺失回 `40001`）

        1. 分类 ID（`category_ids`）
        2. 供需态（`post_type`）
        3. 半径档（`radius`）
        4. 约 500m 坐标网格（`grid_id`）
        5. 数据版本号（`category_version`）

        服务端 Pin 集合缓存 TTL 见 `NfrCache.pinSetTtlSec`；
        客户端单设备缓存键上限见 `NfrCache.maxKeys`，按 LRU 淘汰。

        ### `grid_id` 算法（客户端 / 服务端 / SQL 三方逐位一致）

        - 步长 `0.0045°`（约 500m），原点 `(0, 0)`
        - 取整用 `floor`（**向负无穷**，不是截断）
        - 编码 `"{gx}_{gy}"`，存储类型 `varchar(24)`
        - 精度先向下取整到 5 位小数：`floor(x * 100000) / 100000`
        - 实现走**整数微度域**（避免浮点误差）
        - 入参正则 `^-?\d+_-?\d+$`，不符回 `40001`

        测试向量（10 条，三端共用）：

        | 输入 (lng, lat) | 期望 grid_id |
        | --- | --- |
        | (120.15000, 30.28000) | `26700_6728` |
        | (0, 0) | `0_0` |
        | (0.00450, 0.00450) | `1_1` |
        | (0.00449, 0.00449) | `0_0` |
        | (-0.00001, -0.00001) | `-1_-1` |
        | (-0.00450, -0.00450) | `-1_-1` |
        | (-0.00451, -0.00451) | `-2_-2` |
        | (0.004500049, 0.004500049) | `1_1` |
        | (-0.000015, -0.000015) | `-1_-1`（关键探针，须断言中间值） |
        | (120.15000, -30.28000) | `26700_-6729` |

        ### 聚合模式切换

        按 `zoom` 换算的 metersPerPixel 决定（**不按点数**），
        阈值见 `NfrPerf.clusterModeSwitchMetersPerPixel`：

        - 远景 → `mode=cluster`，服务端预聚合返回 `clusters[]`
        - 近景 → `mode=pin`，返回 `pins[]`，由客户端 Dart 侧做视觉聚合

        ### 响应体积与性能红线

        - `pins` 上限见 `NfrPerf.renderMaxPins`
        - gzip 后 ≤ `NfrPerf.mapPayloadMaxBytes`，原始 ≤ `NfrPerf.mapPayloadMaxRawBytes`
        - 坐标保留位数见 `NfrPerf.mapPinCoordDecimals`
        - 查询走 `post` 表 10 列覆盖索引 `idx_pins_cover`
          （前 5 列过滤 + 后 5 列即响应字段，`EXPLAIN` 须为 `Using where; Using index`）
        - 客户端读取超时对本接口**收紧至 3 秒**（其余接口 10 秒）

        ### 分类树版本协商

        `category_version` 与服务端不一致时**不报错**，响应附
        `category_version_stale: true`；客户端异步拉 `/categories/tree`
        并**清空全部本地 Pin 缓存**。不阻塞、不强升、不回 `40001`。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - name: category_ids
          in: query
          required: true
          description: 分类 ID 列表（缓存键要素 1）。缺失回 40001
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: integer, format: int32 }
          example: '10101,10102'
        - name: post_type
          in: query
          required: true
          description: 供需态（缓存键要素 2）。缺失回 40001
          schema: { $ref: '#/components/schemas/PostTypeEnum' }
        - name: radius
          in: query
          required: true
          description: 半径档（缓存键要素 3）。缺失回 40001
          schema: { $ref: '#/components/schemas/RadiusEnum' }
        - name: grid_id
          in: query
          required: true
          description: 约 500m 坐标网格（缓存键要素 4）。正则不符回 40001
          schema: { $ref: '#/components/schemas/GridId' }
        - name: category_version
          in: query
          required: true
          description: 分类树版本号（缓存键要素 5）。缺失回 40001；不一致不报错
          schema: { $ref: '#/components/schemas/CategoryVersion' }
        - name: lng
          in: query
          required: true
          description: 视野中心经度（GCJ-02）
          schema: { type: number, format: double, example: 120.15 }
        - name: lat
          in: query
          required: true
          description: 视野中心纬度（GCJ-02）
          schema: { type: number, format: double, example: 30.28 }
        - name: zoom
          in: query
          required: true
          description: 当前地图缩放级别，决定 cluster / pin 模式切换
          schema: { type: number, format: float, example: 14.5 }
        - name: price_min
          in: query
          required: false
          description: |
            价格下限（元，可空）。价格是**持久条件**，由条件带维护，
            不随一次语义搜索结束而消失；
            与 `price_max` 同时给出时须 `price_min <= price_max`，否则回 40001。
          schema: { type: number, format: double, minimum: 0, example: 500 }
        - name: price_max
          in: query
          required: false
          description: |
            价格上限（元，可空）。设置上限时 `price IS NULL`（面议）因比较不成立
            而被排除；负数或与 `price_min` 倒置回 40001。
          schema: { type: number, format: double, minimum: 0, example: 2000 }
        - name: community_id
          in: query
          required: false
          description: |
            小区实体 ID（可空）。来自 `/search/resolve` 的 `community_id` 或用户点选的
            `community_candidates[].id`；等值过滤「只看这个小区」，未回填该字段的老帖子
            不会命中——前端须在 0 结果时给出「清除小区筛选」入口。
          schema: { type: string, example: B0FFG12345 }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/PinsCompactResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /posts/search:
    get:
      tags: [map]
      summary: 列表检索（与地图同源筛选条件）
      operationId: searchPosts
      x-batch: Batch1
      x-domain: map
      description: |
        与 `/map/pins` 共用同一套筛选参数与 `category_version` 协商机制，
        差异仅在于返回**带完整卡片字段的分页列表**而非紧凑坐标数组。

        硬过滤层级见 `NfrMatch.hardFilterCategoryLevel`（按 L2 类目硬过滤）。
        列表项**不含完整联系方式**。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: category_ids
          in: query
          required: true
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            items: { type: integer, format: int32 }
        - name: post_type
          in: query
          required: true
          description: |
            供需态，**1–2 个**（PRD §6.4.1 允许「资源 ○ 需求」都选）。

            多值必须走**一次**查询（服务端 `IN` + 在结果集上统一排序与分页）：
            排序与分页都是全局语义，若拆成两次请求再由客户端拼接，「价格降序」
            在端上会表现为「先全部资源、再全部需求」，且分页游标无法对齐。

            **`/map/pins` 刻意保持单值**：它返回的是无序点集，两次请求的并集
            与顺序无关，拆分不影响正确性，故不为此扩大改动面。
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 2
            items: { $ref: '#/components/schemas/PostTypeEnum' }
        - name: radius
          in: query
          required: true
          schema: { $ref: '#/components/schemas/RadiusEnum' }
        - name: grid_id
          in: query
          required: true
          schema: { $ref: '#/components/schemas/GridId' }
        - name: category_version
          in: query
          required: true
          schema: { $ref: '#/components/schemas/CategoryVersion' }
        - name: lng
          in: query
          required: true
          schema: { type: number, format: double }
        - name: lat
          in: query
          required: true
          schema: { type: number, format: double }
        - name: price_min
          in: query
          required: false
          description: |
            价格下限（元，可空）。价格是**持久条件**（与范围/供需/分类同源），
            默认不过滤；与 `price_max` 同时给出时须 `price_min <= price_max`，
            否则回 40001。列表与 `/map/pins` 必须按同一组上下限过滤。
          schema: { type: number, format: double, minimum: 0, example: 500 }
        - name: price_max
          in: query
          required: false
          description: |
            价格上限（元，可空）。设置上限时 `price IS NULL`（面议）因比较不成立
            而被排除，与 `/map/pins` 同一口径；负数或与 `price_min` 倒置回 40001。
          schema: { type: number, format: double, minimum: 0, example: 2000 }
        - name: community_id
          in: query
          required: false
          description: |
            小区实体 ID（可空）。与 `/map/pins` 同口径：来自 `/search/resolve` 的
            `community_id` 或用户点选的 `community_candidates[].id`；缺省表示不做
            小区等值过滤。带上它时列表与地图必须收窄到同一批帖子。
          schema: { type: string, example: B0FFG12345 }
        - name: keyword
          in: query
          required: false
          description: 关键词，可空
          schema: { type: string, maxLength: 32 }
        - name: sort
          in: query
          required: false
          description: |
            排序方式，缺省 `distance`。

            - `distance`：距视野中心近者优先（默认）
            - `publish_time`：发布时间新者优先
            - `completeness`：完整度档位高者优先，同档按发布时间新者优先
            - `composite`：综合 = **时效 40% + 距离 40% + 完整度档 20%**（PRD §6.11
              阶段 0 规则加权，唯一口径；完整度档 = 🟢1.0 / 🟡0.5 / 🔴0.2），各项
              归一化后加权，上界取距离 20km / 时效 7 天，与客户端 `_compositeScore`
              同口径（常量真源 `NfrMatch`）
            - `price_asc`：价格升序
            - `price_desc`：价格降序

            **无价格（`price = null`，「面议」）的条目在两种价格排序中一律排末尾**
            （升序降序皆然）：把 null 当 0 会让「免费/面议」在升序里霸占首屏，
            当极大值则会在降序里霸屏 —— 两个方向都沉底才符合「不参与价格比较」。
          schema:
            type: string
            enum: [distance, publish_time, completeness, composite, price_asc, price_desc]
            default: distance
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [items, total, page, page_size]
                        properties:
                          items:
                            type: array
                            items: { $ref: '#/components/schemas/PostCard' }
                          total: { type: integer, format: int32 }
                          page: { type: integer, format: int32 }
                          page_size: { type: integer, format: int32 }
                          category_version_stale:
                            type: boolean
                            description: true 表示客户端分类树版本已过期，需异步刷新并清空 Pin 缓存
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 分组六：详情与联系（共 4 个接口，Batch1 覆盖 2 个）
  # ===========================================================================

  /posts/{post_id}/contact:
    get:
      tags: [contact]
      summary: 获取完整联系方式（全系统唯一出口）
      operationId: getPostContact
      x-batch: Batch1
      x-domain: contact
      description: |
        **本接口是全系统唯一返回完整联系方式的接口**，其他任何接口
        （详情、列表、卡片）都只回脱敏值。

        ### 五重防护

        | 层 | 阈值 | 触发错误码 |
        | --- | --- | --- |
        | 未登录 | — | `40101` |
        | 账号维度 | ≤ 30 次/日 | `42902` |
        | 设备指纹维度 | ≤ 30 次/日 | `42902` |
        | IP 维度 | ≤ 100 次/日 | `42902` |
        | 熔断 | 1 分钟内 ≥ 10 次 → 当日冻结 | `42903` |

        账号级风控键一律用 `user_id`（不用手机号）。
        `42902` / `42903` 均携带 `Retry-After`。

        **B2-6a 身份门禁**：当前账号未绑定手机号（`phone_bound=false`）→ `40302`，
        先于配额检查，不消耗配额；客户端引导完成 `POST /auth/phone/bind`。

        ### 成功后的两件事（写两张表，不可省）

        1. 写 `contact_event` —— **北极星辅助指标的唯一统计点**
        2. 写 `audit_log` —— 合规审计留痕
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/ContactInfo'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/{post_id}/report:
    post:
      tags: [contact]
      summary: 举报帖子
      operationId: reportPost
      x-batch: Batch1
      x-domain: contact
      description: |
        举报原因枚举与 `report.reason` 列一致。
        举报频次异常触发熔断回 `42903`。
        举报成功同时落 `audit_log`。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  enum: [false_info, fraud, wrong_category, harassment, other]
                  description: 举报原因，与 report.reason 枚举严格一致
                remark:
                  type: string
                  maxLength: 200
                  description: 补充说明，可空
                evidence:
                  type: array
                  description: 证据媒体 ID 列表，落 report.evidence（JSON 列）
                  maxItems: 3
                  items: { type: string }
      responses:
        '200':
          description: 举报已受理
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          report_id: { type: integer, format: int64 }
                          status:
                            type: string
                            enum: [pending, handled, dismissed]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/{post_id}/similar:
    get:
      tags: [contact]
      summary: 相似推荐
      operationId: listSimilarPosts
      x-batch: Batch2
      x-domain: contact
