  # ===========================================================================
  # 分组三：发布与媒体（共 11 个接口，Batch1 覆盖 7 个）
  # ===========================================================================

  /media/upload/ticket:
    post:
      tags: [post]
      summary: 申请 OSS 直传票据（两步式第 1 步）
      operationId: createUploadTicket
      x-batch: Batch1
      x-domain: post
      description: |
        ### OSS 两步式直传的七条安全约束

        1. 客户端**不持有任何长期密钥**，仅拿到短时效的直传签名
        2. OSS 桶**不开公共读**，下发的 `url` 为带签名的临时访问地址
        3. **原图删除与 `commit` 在同一事务内同步完成**（不走异步补偿）
        4. 不挂 CDN；若挂则必须禁用图片处理过滤参数
        5. `media_id` 与 OSS 对象名（`object_key`）**均由服务端生成**，客户端不可指定
        6. OSS 侧强制 `content-length-range` 与 `content-type` 白名单，
           `commit` 时服务端**二次校验**实际对象的大小与类型
        7. 以 OSS 回调为 `commit` 的触发源；24h 未 `commit` 的 pending 记录由定时任务清理；
           `commit` 成功后对象**不可覆写**
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size, content_type]
              properties:
                filename:
                  type: string
                  maxLength: 128
                  description: 原始文件名，仅用于记录与后缀推断，不作为对象名
                  example: IMG_0421.jpg
                size:
                  type: integer
                  format: int32
                  description: 文件字节数。超出 OSS content-length-range 上限回 40001
                  example: 1843200
                content_type:
                  type: string
                  description: MIME 类型，须在服务端白名单内
                  enum: [image/jpeg, image/png, image/webp]
      responses:
        '200':
          description: 票据签发成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/UploadTicket'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /media/{media_id}/commit:
    post:
      tags: [post]
      summary: 确认媒体上传完成（两步式第 2 步）
      operationId: commitMedia
      x-batch: Batch1
      x-domain: post
      description: |
        ### `audit_status` 三态双视角

        | 状态 | 本人视角 | 他人视角 |
        | --- | --- | --- |
        | `pending` | 展示「审核中」，**允许提交发布** | **不下发** |
        | `pass` | 正常展示 | 正常展示 |
        | `reject` | 可见 `reject_reason`，可替换重传 | **不下发** |

        **硬规则**：`audit_status != pass` 的 `media_id`
        不得出现在任何**非本人**可见的响应中。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: media_id
          in: path
          required: true
          schema: { type: string, example: mda_9c1f4e7b2a }
      responses:
        '200':
          description: 确认成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/MediaCommitResult'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  /posts/precheck:
    post:
      tags: [post]
      summary: 发布前置校验（不落库）
      operationId: precheckPost
      x-batch: Batch1
      x-domain: post
      description: |
        在用户点击「发布」之前提前暴露阻断项，避免填完长表单才报错。
        校验项与 `POST /posts` 完全一致但**不写库**：
        敏感词（`40901`）、图片过审（`40902`）、类目禁发（`40303`）、
        高敏类目资质（`40302`）、未实名发布上限（`40304`）。

        校验通过时 `data.passed=true`；发现问题时**仍返回 200 + code=0**，
        由 `data.blocks[]` 列出全部阻断项（一次性给全，不逐条打断用户）。
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
