  /posts/{post_id}/view:
    post:
      tags: [contact]
      summary: 详情曝光上报
      operationId: reportPostView
      x-batch: Batch2
      x-domain: contact
      description: |
        详情页曝光上报（浏览计数写入）。客户端在详情数据渲染成功后调用一次，
        失败静默，不阻塞详情展示。

        - **去重口径**：登录用户按 `user:<id>`、游客按 `device:<X-Device-Id>`，
          以「人/天」为唯一键；同一用户/设备同日重复上报不增加计数。
        - **作者排除**：作者本人浏览自己的帖子不计数。
        - **跨身份合并**：登录用户上报时合并当日同设备的游客行，保证
          「先游客后登录」同日只计 1。
        - **幂等**：服务端按唯一键去重，重复上报仍返回 200。
        - **限频**：按账号与 IP 维度限频，超限走既有 429 业务码。
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200': { description: 上报成功（含去重命中） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ===========================================================================
  # 分组七：认证（共 3 个接口，Batch2 覆盖 3 个）
  # ===========================================================================

  /cert/realname:
    post:
      tags: [cert]
      summary: 提交实名认证（二要素核验）
      operationId: submitRealname
      x-batch: Batch2
      x-domain: cert
      description: |
        - 提交姓名 + 身份证号做二要素核验（DEC-30：阿里云实人认证·信息核验·纯服务端 API）
        - 「手机号一致性」由已登录态保证（短信验证码登录即证明手机号归本人），
          **不向供应商传手机号、不解密 `user_identity`**
        - 核验通过 → `user.realname_status='passed'` + 落 `cert` 表；姓名加密落 `real_name_enc`
          （AAD 绑定 `user_id`）、身份证只存 `id_card_hash`（HMAC 盲索引）+ `id_card_last4`
        - 核验失败复用 `40001`（参数/核验不通过）；连续失败达阈值锁定（`cert.lock_until`）
        - 上游认证服务不可用回 `50302`
        - **实名相关敏感列（real_name / id_card）禁止出现在任何 API 响应中**
      parameters:
        - $ref: '#/components/parameters/XInteractionId'
        - $ref: '#/components/parameters/XDeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameSubmitRequest'
      responses:
        '200':
          description: 实名认证成功（或已实名幂等返回）
          content:
            application/json:
              schema:
                allOf:
