org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Kotlin 改用 in-process 编译，不走独立 daemon 进程。
#
# 【为什么必须加】本机用户目录含中文（C:\Users\刘杰\），pub cache 默认落在其下。
# Gradle 把待编译源文件列表传给 Kotlin daemon 时，中文被转义成 \u5218\u6770 且
# 反斜杠丢失，daemon 收到的是不存在的「C:\Users\u5218u6770\...」，于是 release
# 构建必然失败：
#   error: source file or directory not found:
#     C:\Users\u5218u6770\...\SharedPreferencesPlugin.kt
#
# 【易误判点】报错只说「文件找不到」，一个字不提编码，极易被当成依赖损坏而去清
# pub cache 重装 —— 白折腾且照样失败。真正的线索是路径里的 u5218u6770。
#
# 【为什么不是 daemon 编码问题】kotlin.daemon.jvmargs=-Dfile.encoding=UTF-8 实测
# 无效：路径在传给 daemon 之前就已写坏，不是 daemon 解码错。改 in-process 后同一
# 任务 19 秒构建成功，据此定死根因在进程边界。
#
# 【代价评估】in-process 会让 Kotlin 增量编译变慢、Gradle daemon 内存压力变大。
# 本项目 Kotlin 仅有插件胶水与 MainActivity，主体是 Dart，故此代价接近于零。
#
# 【另一条路及其取舍】把 PUB_CACHE 迁到纯英文路径能根治，但那是机器级改动：影响
# 本机所有 Flutter 项目、需重下全部依赖，属开发者本人的环境决策，不由项目代劳。
# 若将来迁移了，此行可删；保留亦无害。
kotlin.compiler.execution.strategy=in-process
