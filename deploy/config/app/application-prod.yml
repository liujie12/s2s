# ============================================================================
# S2S 外部化配置 —— prod（生产环境）
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§14.4 配置中心（Profile 外部化落地形态）
#
# 加载机制同 dev：本文件由 compose 挂载到容器 /opt/s2s/config/ 目录，
# 优先级高于 jar 包内的 application-prod.yml。
#
# 纪律：
#   1. 本文件【入 git】，禁止出现任何密钥/口令/AT。
#   2. 日志级别 WARN（仅生产错误告警，INFO 级别的日志量在 2G 机器上
#      会显著挤占磁盘预算，且日志轮转的 I/O 也会增加 CPU 开销）。
#   3. schema 变更纪律：本项目【禁用 JPA】（KTD-2 定案，曾有的 spring.jpa.* 块已删除），
#      表结构只能由应用内 Flyway migration 变更（编码规范 §4.9），
#      变更随发版受控执行，杜绝任何 ORM 自动改表路径。
# ============================================================================

spring:
  datasource:
    hikari:
      # 2G 物理机、750MB JVM 下，10 个连接是合理上限。
      # 每个连接约 10MB 堆外开销，10 个 = 100MB，在剩余预算内。
      # 若并发不足需调整，同步更新《部署架构设计文档》§3.1 内存预算表。
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# --- 日志级别 ---------------------------------------------------------------
logging:
  level:
    root: WARN
    # 生产环境只记 WARN 及以上，避免 INFO 日志量过大
    # 如果出现需排查的线上问题，通过 Actuator 动态调整日志级别，
    # 不重启容器（POST /actuator/loggers/com.s2s -d '{"configuredLevel":"DEBUG"}'）
    com.s2s: WARN
    # 访问日志独立 logger 显式放行（[122] U2/KTD5）：不落 com.s2s 层级，
    # 若不放行会被 root: WARN 压制——每请求一条 INFO（8 字段之 path/code/rt_ms），
    # 日志量恒定可控（QPS 量级），不参与「WARN 省盘」的收敛对象
    ACCESS: INFO

# --- Actuator ---------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # 生产环境只暴露 health 端点
        # 如果需动态调日志级别，临时启用 loggers 端点，用完即关
        include: health
  endpoint:
    health:
      # 生产环境不对外展示组件明细，只返回 UP/DOWN
      # 内部组件详情通过容器内 curl 查看
      show-details: never

# --- 业务开关 ---------------------------------------------------------------
# ⚠ 键名必须是代码真正读取的。本文件原写的 s2s.oss.enabled / s2s.llm.enabled
#   都是死键（全仓无 @Value / @ConditionalOnProperty 读取），已订正为下列真实键名：
#     OSS    → s2s.oss.mock    （true = dev 桩 DevOssClient / false = 真 SDK AliyunOssClient）
#     大模型 → s2s.ai.dry-run  （true = 纯规则桩 / false = 真 API）
s2s:
  oss:
    # 生产必须走真 SDK（OssClient 头注安全红线：生产路径必须为真 SDK）。
    # 依赖 OSS_ENDPOINT 与 OSS_BUCKET_NAME 非空，见 deploy/env/.env.prod。
    mock: false
  ai:
    # B2-4 阶段①：真实通义千问（百炼 OpenAI 兼容）通道已实现（2026-10-15）。
    # true = 纯规则桩（不调模型、不产生费用）；false = 真实 HTTP 调用。
    # ⚠ 改 false 的【前置】：DASHSCOPE_API_KEY 必须已注入（deploy/env/.env.prod），
    #   否则每次请求抛 IllegalStateException → 50301（刻意不静默回退）。
    # ⚠ Key 由 .env.prod 在【容器创建时】注入 —— 改完须「重建容器」（compose up -d --no-deps app），
    #   docker restart 不生效；domain/模型名默认取 application.yml（AI_MODEL/AI_ENDPOINT 可覆盖）。
    # 备案复核（开工/上线前）：模型须仍在国家网信办已备案清单内（禁用境外模型）。
    #   2026-10-15 复核通过：ZheJiang-TongYiQianWen-20230901 仍在册。
    # 【2026-10-15 临时置 false】：Step 1（文本通道）真实接口验收需要真通道；
    #   验收完成后须按裁定回退 true 或保留 —— 生成式AI「登记」（属地网信办，领上线编号）
    #   属「上线前闸门」，未取得上线编号前不宜对内测用户长期开放真通道。
    dry-run: false
  sms:
    # 内测白名单（2026-10-14 裁定，A+B 分阶段的 B 阶段临时收口）。
    # 背景：短信渠道仍是 dev 桩（验证码固定 888888、不接真服务商），不收口则线上任何
    # 知道该码的人都能登录任意手机号；本名单把可登录范围收敛为名单内号码。
    #
    # 【怎么改】在下面这行增删手机号（逗号分隔），然后重启容器生效：
    #   docker restart s2s-app
    # （注意：直接改服务器上这份文件会与仓库版本产生差异，下次 git pull 前需先 commit 或 stash；
    #   或者改仓库里这一行 → 提交 → 正常发版，二者选其一。）
    #
    # ⚠ 名单清空/删掉 ⇒ 谁都登不进（fail-closed，立刻暴露，不是静默放开）。
    # ⚠ 【切勿写成空串】—— 空 = 不启用 = 全放行，等于没收口。
    whitelist: "15955146851,18674750845"