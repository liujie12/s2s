# ============================================================================
# S2S 外部化配置 —— staging（预发布验证）
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§14.4 配置中心（Profile 外部化落地形态）
#
# 加载机制同 dev：本文件由 compose 挂载到容器 /opt/s2s/config/ 目录，
# 优先级高于 jar 包内的 application-staging.yml。
#
# 纪律：
#   1. 本文件【入 git】，禁止出现任何密钥/口令/AT。
#   2. schema 一致性口径与 prod 一致：本项目【禁用 JPA】（KTD-2 定案），
#      唯一管理者是应用内 Flyway migration（编码规范 §4.9），应用启动即校验并迁移。
#      若 staging 迁移通过而 prod 失败，说明 Flyway 脚本在两环境之间未同步
#      —— 这是 CI/CD 流程缺陷，不是配置问题。
#   3. 日志级别与 prod 一致（WARN），确保「staging 验过 = prod 能过」。
#      若 staging 开 DEBUG 而 prod 关，则 staging 通过不能代表 prod 行。
# ============================================================================

spring:
  datasource:
    hikari:
      # 与 prod 相同的池大小，模拟生产并发
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

# --- 日志级别（与 prod 一致：WARN）-------------------------------------------
logging:
  level:
    root: WARN
    com.s2s: WARN
    # 访问日志独立 logger 显式放行（[122] U2/KTD5）：不落 com.s2s 层级，
    # 若不放行会被 root: WARN 压制——每请求一条 INFO（8 字段之 path/code/rt_ms），
    # 日志量恒定可控（QPS 量级），不参与「WARN 省盘」的收敛对象
    ACCESS: INFO

# --- Actuator ---------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        # staging 只暴露 health，与 prod 一致
        include: health
  endpoint:
    health:
      show-details: when-authorized

# --- 业务开关 ---------------------------------------------------------------
s2s:
  oss:
    # staging 启用真实 OSS，但用 staging 专属桶（s2s-media-staging）
    # 不会污染线上数据
    enabled: true
  llm:
    # staging 启用真实 LLM 调用，验证 API 连通性
    enabled: true