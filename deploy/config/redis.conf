# ============================================================================
# S2S Redis 7 配置文件
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§3.1 内存预算表、§4.1 盘分配表
#       《技术栈选型说明》§6（maxmemory 128MB、maxmemory-policy volatile-lru、
#        AOF appendfsync everysec — 三个「必须显式定死，不能用默认值」的参数）
#       《系统安全设计方案》§10（requirepass 必须设）
#
# 纪律：
#   1. requirepass 由 docker-compose 的 --requirepass 参数传入，从此文件移除
#      以防止口令随配置文件进入 git
#   2. maxmemory 和 maxmemory-policy 是硬性参数，不能用默认值
#   3. 端口 6379 仅容器内可达，不映射到宿主机（无 ports:）
# ============================================================================

# -- 内存配置（必须在生产环境显式设置）------------------------------------------
# 内存预算 150MB，数据面最大使用 128MB，剩余 22MB 给 Redis 自身开销
maxmemory 128mb

# 淘汰策略：对设置了 TTL 的键使用 LRU 近似算法
# 会话、缓存聚合结果等均有 TTL，淘汰后由应用层回源
# 禁止使用默认值 noeviction（无淘汰策略下超内存会直接 OOM 或拒写）
maxmemory-policy volatile-lru

# 内存采样（LRU 近似算法的精度，5 是默认值，2 核机器已足够）
maxmemory-samples 5

# -- 持久化（AOF + RDB 混合，盘分配 AOF 预算 1GB）-------------------------------
# 启用 AOF 以最小化重启时的数据丢失
appendonly yes

# 每秒刷盘一次：兼顾性能与数据安全
# 在 2G 内存 + 128MB 数据的场景下，实测每秒 fsync 无明显性能影响
# 禁止使用默认值 no（appendfsync no 在意外宕机时丢失最近一段时间的全部写入）
appendfsync everysec

# AOF 重写触发条件
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 快照（作为 AOF 的补充，加快重启加载速度）
save 900 1
save 300 10
save 60 10000

# 数据持久化文件名
dbfilename dump.rdb
appendfilename "appendonly.aof"

# -- 网络配置 -------------------------------------------------------------------
# 仅监听容器内地址（端口不映射到宿主机）
bind 0.0.0.0
port 6379

# 保护模式：在无 requirepass 时限制外部访问
# 注意：在 docker-compose 中已通过 --requirepass 设置口令，且无 ports 映射
protected-mode yes

# 未设置口令时的连接超时（秒）
timeout 0

# -- 连接与客户端 ----------------------------------------------------------------
# Spring Boot 应用使用连接池，保持合理的最大连接数
maxclients 100

# 后台运行（容器内以 daemonize no 运行，由 Docker 管理进程生命周期）
daemonize no

# -- 日志 -----------------------------------------------------------------------
# 日志级别：notice 适合生产环境，warning 仅输出关键事件
loglevel notice
logfile ""

# -- 慢查询日志 -----------------------------------------------------------------
# 单位是【微秒】，10000 微秒 = 10ms
# 取 10ms 而非 Redis 默认的 10000ms：Redis 命令正常应在亚毫秒级完成，
# 10ms 已属异常，用于定位可观测性阈值 T3 的根因（大 key、O(n) 命令、阻塞式操作）
slowlog-log-slower-than 10000
slowlog-max-len 128