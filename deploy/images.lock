# ============================================================================
# S2S 容器镜像基线台账
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§14.6 容器镜像基线
#
# 用途：锁定三套环境【共用】的基础镜像 tag 与 digest，确保构建可复现。
#       三环境共用同一基线是「dev 能过 prod 也能过」的前提，
#       禁止按环境分叉 —— 分叉意味着 dev 从没测过的 MySQL 版本在 prod 上跑。
#
# 为什么 tag 不够、还要 digest：
#   tag 是【可变引用】。caddy:2.8-alpine 在上游发补丁时会被重新指向新镜像，
#   同一条 compose 文件今天和三个月后 pull 到的可以是不同的二进制。
#   digest 是内容哈希，是唯一真正不可变的标识。台账记录 digest 才能回答
#   「线上这个容器到底是哪一版」——回滚与安全响应都依赖这个答案。
#
# ---------------------------------------------------------------------------
# 格式（每行一条，# 开头为注释）：
#   <镜像名>:<tag> <digest 或 PENDING>
#
# digest 值已于 2026-10-07 首次填充（首次生产部署实测，环境见
#   deploy/docs/部署操作手册.md 附录 D）。
#
# 【来源说明 · 重要】填充时目标服务器无法直连 Docker Hub
#   （registry-1.docker.io 超时），镜像系经第三方镜像站 docker.1panel.live
#   拉取后用 docker tag 改为官方名。下列 digest 取自这些本地镜像的
#   RepoDigests —— 记录的是【实际运行镜像】的内容哈希，故 --verify 在本机可通过。
#   若日后改从 Docker Hub 官方拉取，须重新核对 digest
#   （第三方站若为透明代理则一致，若重新打包则不同）。
#
# 【禁止】凭空编造 sha256 值 —— 假 digest 比没有 digest 更危险：校验脚本会拿它
#   去比对并永远报不一致，几次之后所有人都会开始无视这个告警，基线就此失效。
#
# 正规填充方式（在能联网 pull 的机器上执行一次即可）：
#   bash deploy/scripts/image-baseline.sh --refresh
# 该命令会 pull 全部镜像、读取真实 digest 并就地回写本文件，随后提交入库。
#
# 后续校验（每次发版前，由 gate-check.sh 调用）：
#   bash deploy/scripts/image-baseline.sh --verify
#
# 纪律：
#   1. 【禁止】latest / RELEASE / 版本范围，tag 必须精确
#   2. 升级镜像版本时，改 tag 后必须重跑 --refresh 更新 digest，
#      并在提交信息里写明升级原因与验证结果
#   3. digest 一旦填入即入库，本文件是【可审计的版本事实来源】
# ============================================================================

# ---------------------------------------------------------------------------
# 运行期镜像（三环境完全一致）
# ---------------------------------------------------------------------------

