# ============================================================================
# S2S 环境 override —— prod（生产环境）
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§14.3 三环境差异矩阵
#
# 用途：线上对外服务，公网可达，Caddy 使用 ACME 自动证书。
#       ⚠ 2026-10-10 起，prod 与 staging 在「数据面端口映射」上不再一致：prod 额外映射
#       3316(mysql) / 6389(redis) / 7080(app) 三条直连端口（用户裁定，见说明文档
#       §2.9 DEC-28、《部署架构设计文档》§14.3）；staging 保持零映射。除该条外，两者
#       仍完全一致（镜像 tag / 配置 / 内存限制 / JVM 参数）。
#       其余差异仅在于 Caddy 端口映射（443/80）与 Caddyfile（ACME 公网证书）。
#
# 启动：bash deploy/scripts/env-up.sh prod
#
# 与 staging 的差异（仅以下三项）：
#   ① Caddy 端口映射到标准 HTTPS/HTTP 端口（443/80），需 root 权限
#   ② Caddyfile 使用 ACME 自动证书（Let's Encrypt），需公网 DNS 可达
#   ③ 【2026-10-10 新增】app/mysql/redis 各多一条直连端口映射（7080/3316/6389），
#      staging 无 —— 这是两环境唯一的实质分叉，由用户裁定，见 §2.9 DEC-28
#
# 安全性（⚠ 2026-10-10 变更，详见说明文档 §2.9 DEC-28）：
#   · Caddy 仍是业务的唯一 TLS 入口（443）
#   · 【已裁定的例外】prod 额外映射三条数据面直连端口：
#       mysql 0.0.0.0:3316 → 容器 3306
#       redis 0.0.0.0:6389 → 容器 6379
#       app   0.0.0.0:7080 → 容器 8080（绕过 Caddy，明文 HTTP、无 TLS）
#   · 代价（如实记录）：旧论证「即使 Caddy 被攻破也无法直连数据库」【不再成立】；
#     且 DEC-05 里「MySQL 仅容器网络」的安全前提被打破 —— 现行 sslMode=REQUIRED
#     只加密、不校验证书主体，公网可达后任何人可冒充 MySQL 服务端窃取库口令。
#     收紧路径（待裁定）：sslMode=VERIFY_CA + MySQL CA 装进应用信任库。
#   · 现防线：安全组源 IP 白名单（务必【不要】开 0.0.0.0/0）+ 强口令。
#   · 见《部署架构设计文档》§5.1 暴露面表（已同步修订）。
#
# 注：env_file 统一在 base docker-compose.yml 中按 ${S2S_ENV} 声明，
#     本文件不再重复声明，原因见 base 文件头部「env_file 与 --env-file 的分工」。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Caddy —— prod 标准端口，ACME 自动证书
  # 443/80 需要 root 权限，因此 docker compose up 需要 sudo 或 root 用户
  # --------------------------------------------------------------------------
  caddy:
    # 无 volumes 段：Caddyfile 挂载由 base compose 统一按 ${S2S_ENV:-prod} 拼出
    # 路径为 ./config/Caddyfile.prod，无需 override 重复声明
    ports:
      - "0.0.0.0:443:443"
      # 80 不绑：宿主机 80 被系统 nginx 占用（2026-10-06 首次部署实测 —— nginx 正
      # 服务 implement/gdjt/hefei/mg/jy/gh/iot 等多个 build110.com 子域名，不可停）。
      # 代价：ACME 只能用 TLS-ALPN-01（443）挑战，HTTP-01 不可用；
      # 「HTTP→HTTPS 301 跳转」（门禁 G6）在 Caddy 侧失效，如需 301，
      # 应在宿主机 nginx 侧为 s2s.build110.com 新增一条 80 跳转 server 块。
      # - "0.0.0.0:80:80"
    mem_limit: 64m

  # --------------------------------------------------------------------------
  # 应用 —— prod profile，严格内存限制
  # --------------------------------------------------------------------------
  app:
    # 2026-10-10 用户裁定：直连入口。绕过 Caddy ⇒ 明文 HTTP、无 TLS、无 Caddy 侧限流；
    # prod 的 Actuator 仅暴露 health，故 :7080 上不存在诊断端点。
    # 容器内仍监听 8080（Caddy upstream 与 healthcheck 均指向 app:8080，不动）。
    ports:
      - "0.0.0.0:7080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # prod 仅暴露 health 端点
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health
      # 变量名必须是 JAVA_OPTS，与 Dockerfile ENTRYPOINT 中的 $JAVA_OPTS 对应，
      # 详见 docker-compose.staging.yml 同处注释
      JAVA_OPTS: "-Xmx600m -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
    mem_limit: 750m

  # --------------------------------------------------------------------------
  # MySQL —— 2026-10-10 起有端口映射（0.0.0.0:3316 → 容器 3306，见 §2.9 DEC-28）
  # ⚠ 公网可达 ⇒ DEC-05「MySQL 仅容器网络」的安全前提失效；收紧路径见文件头「安全性」段。
  # mem_limit 2026-10-09（[142]）由 450m 放宽至 768m：450m 下 mysqld RSS 顶格
  #   （418–455MB）被 cgroup OOM-killer 反复击杀（RestartCount=76）→ 连接全断
  #   → /map/pins 10.1% 500 + 30s 长尾。宿主实测 31GB（部署操作手册 D.1），
  #   原「2GB 严格预算」前提作废。同步见《部署架构设计文档》§3.1。
  # --------------------------------------------------------------------------
  mysql:
    ports:
      - "0.0.0.0:3316:3306"
    mem_limit: 768m

  # --------------------------------------------------------------------------
  # Redis —— 2026-10-10 起有端口映射（0.0.0.0:6389 → 容器 6379，见 §2.9 DEC-28）
  # ⚠ requirepass 仍生效，但 Redis 无 TLS：AUTH 与数据在公网上均为明文 ⇒ 安全组
  #   源 IP 务必限为白名单，不要开 0.0.0.0/0。
  # --------------------------------------------------------------------------
  redis:
    ports:
      - "0.0.0.0:6389:6379"
    mem_limit: 150m