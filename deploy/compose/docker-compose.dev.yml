# ============================================================================
# S2S 环境 override —— dev（本地开发）
# ----------------------------------------------------------------------------
# 依据：《部署架构设计文档》§14.3 三环境差异矩阵
#
# 用途：开发机（Windows + WSL2 / Docker Desktop）上的本地联调环境。
#       它不是「缩小版生产」，而是刻意为调试便利做了三处放宽，每处都写明了
#       为什么在 dev 可以放宽、以及为什么在 staging/prod 绝不可以。
#
# 启动：bash deploy/scripts/env-up.sh dev
#
# 与 staging/prod 的三处刻意差异：
#   ① 数据面端口对宿主机映射（3306 / 6379 / 8080）
#      放宽理由：本地要用 DataGrip / RedisInsight 连库看数据，不映射就得每次
#                docker exec 进容器敲 mysql 客户端，调试效率损失巨大。
#      为何 prod 不可：《系统安全设计方案》§10 —— 3306/6379 暴露到公网等于
#                数据库与全量会话直接可被取走。门禁 G1 对 staging/prod 强制拦截。
#      安全前提：dev 的映射一律绑定 127.0.0.1 而非 0.0.0.0，即使开发机在公网
#                环境下也不会对外可达（写成 "127.0.0.1:3306:3306" 而非 "3306:3306"）。
#   ② 不启动 Caddy
#      放宽理由：ACME 对 localhost 无法签发证书，强行启动会反复失败并可能触发
#                Let's Encrypt 的速率限流（一周内失败次数有上限）。
#      替代方式：直连 http://localhost:8080，TLS 链路在 staging 上验证。
#   ③ mem_limit 显著放宽（app 1500m）
#      放宽理由：开发机内存通常 16G 以上，不存在 2G 约束；而 -Xmx600m 的限制会
#                让本地跑集成测试时频繁 GC，拖慢反馈循环。
#      为何 prod 不可：2G 物理内存是硬边界，见《部署架构设计文档》§3.1。
#
# 不放宽的一项（刻意保留）：Redis requirepass 在 dev 同样必须设置。
#   「本地就不设密码」是最常见的配置漂移来源 —— 代码里写死无口令连接，
#   到 staging 才发现连不上。dev 保留口令是为了让连接代码路径与 prod 一致。
#
# ⚠ 本文件的放宽项【禁止】复制到 staging / prod override。
#   门禁脚本 gate-check.sh 会按环境分级校验，dev 的宽松判据不适用于另两套。
#
# 注：env_file 统一在 base docker-compose.yml 中按 ${S2S_ENV} 声明，
#     本文件不再重复声明，原因见 base 文件头部「env_file 与 --env-file 的分工」。
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # Caddy —— dev 环境默认不启动
  # profiles 机制：未在命令行显式 --profile tls 激活时，该服务不会被创建。
  # 这比删掉服务定义更好：保留定义使得需要验证 TLS 链路时可临时
  #   bash deploy/scripts/env-up.sh dev --profile tls
  # 拉起，用 Caddyfile.dev 的 internal 自签证书走一遍完整 HTTPS 链路。
  # --------------------------------------------------------------------------
  caddy:
    profiles:
      - tls
    mem_limit: 128m
    # 8443 而非 443：开发机上 443 常被其他服务（IIS / 已有 nginx）占用，
    # 且非特权端口不需要额外权限
    ports:
      - "127.0.0.1:8443:443"

  # --------------------------------------------------------------------------
  # 应用 —— dev profile，端口映射到宿主机便于直连调试
  # --------------------------------------------------------------------------
  app:
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # dev 放开 Actuator 全部端点，便于查看 /actuator/env、/actuator/beans
      # 排障。staging/prod 仅暴露 health（见各自 override 与 application-prod.yml）。
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "*"
      # 本地不需要 600MB 上限，放宽到 1200m 以减少集成测试期间的 GC 抖动
      JAVA_OPTS: "-Xmx1200m -Djava.security.egd=file:/dev/./urandom -Dfile.encoding=UTF-8"
    # 绑定 127.0.0.1：即使开发机处于公网也不对外可达
    ports:
      - "127.0.0.1:8080:8080"
    mem_limit: 1500m
    healthcheck:
      # dev 缩短间隔与 start_period，加快「改代码 → 重启 → 可用」的反馈循环
      interval: 10s
      start_period: 30s

  # --------------------------------------------------------------------------
  # MySQL —— dev 映射 3306 供本地 GUI 客户端连接
  # --------------------------------------------------------------------------
  mysql:
    ports:
      - "127.0.0.1:3306:3306"
    mem_limit: 1024m

  # --------------------------------------------------------------------------
  # Redis —— dev 映射 6379，requirepass 依然生效（见文件头「不放宽的一项」）
  # --------------------------------------------------------------------------
  redis:
    ports:
      - "127.0.0.1:6379:6379"
    mem_limit: 512m
