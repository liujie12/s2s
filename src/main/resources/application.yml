# ─────────────────────────────────────────────────────────────────
# 找丫找（s2s）后端 · 应用配置（条目[121] U-1 建立最小占位；U-4 补双库数据源与 Flyway 迁移；
# U-5 完成配置外部化与启动快速失败：server.error 双保险、Redis 接入、s2s.secrets 六类凭证硬占位）
#
# U-5 起的变化：
#   1. 两种占位形式与快速失败的真实机制（编码规范 §3.3；U-5 实测修正，勿凭直觉改回）：
#      （注释中占位示例以全角＄书写，避免污染 .env.example 双向核对正则的匹配集合）
#      - ＄{VAR:?}（compose 风格非法默认值）：仅用于业务库 datasource 三项。未注入时占位解析为
#        非法值 "?"，HikariCP 初始化即失败——但其报错（如 Access denied）不含变量名，不易定位；
#      - ＄{VAR}（无默认值硬占位）：用于 s2s.secrets.* 与 spring.data.redis.password。
#        注意（U-5 N2 实测踩坑）：@ConfigurationProperties 绑定走非严格占位解析，
#        未注入时【不抛异常】而是绑进字面量 "＄{VAR}"——因此 s2s.secrets 的快速失败闸门
#        不在占位本身，而在 SecretsProperties 紧凑构造器的 requireResolved 守卫
#        （null/空白/"＄{...}" 字面量三种形态一律拒收并点名变量名）。
#        严格解析（未注入即抛 Could not resolve placeholder 'VAR'）只存在于 @Value
#        硬注入路径（config/FlywayTrackConfig 的 TRACK_DATASOURCE_URL 等三变量）。
#      s2s.secrets.db-password 与 datasource.password 引用同一变量是刻意的双保险，
#      不是字面量复制（引用的是同一常量名，不违反编码规范 §0.2「不复制字面量」）。
#   2. Redis 已接入（原 U-4 注释「Redis 仍未配置」作废）：spring-boot-starter-data-redis 的
#      自动装配只建连接工厂不建连接（Lettuce 首次使用时才连），Redis 未启动不阻塞应用启动，
#      /actuator/health 的 redis 组件报 DOWN 属预期；password 属六类凭证走硬占位
#      （快速失败由 SecretsProperties 守卫兜底，同变量），
#      host/port 非密钥，带本地开发默认值（带默认值形式不匹配 .env.example 核对正则，不进模板）。
#   3. s2s.secrets.* 六类凭证（编码规范 §3.3：不入仓库、不入镜像、只占位）：
#      DB 口令 / Redis 口令 / HMAC pepper 列表 / AEAD 主密钥列表 / OSS AK/SK / 短信与高德 Key；
#      其中两个密钥列表按 key_version 列表结构承载 JSON（安全 §4），Batch1 只绑定不解析，
#      解析随条目[124] crypto 组件落地。变量名与仓库根 .env.example 逐一对应（双向核对零差异）。
#   4. server.error.include-stacktrace: never —— 「日志打全栈、响应体无堆栈」的配置层双保险
#      （编码规范 §4.3；详设 §2.2），兜住未被 GlobalExceptionHandler 接住的 /error 路径。
#   5. KTD-3：Java 21 不开虚拟线程，全文件不出现 spring.threads.virtual.enabled
#     （退出条件：Java 24 或压测证明 I/O 阻塞）。
#   6. [122] 起的变化：
#      - server.forward-headers-strategy: framework（[122] KTD2）——Caddy 反代后 IP 维限频
#        （rl:sms:ip / rl:contact:ip / rl:guestdetail:ip）须取真实客户端 IP；framework 策略
#        读 X-Forwarded-For 且无头时回退 remoteAddr（本地直连开发兼容）。安全前提：Caddy
#        覆盖式 header_up X-Forwarded-For {remote_host}（禁追加/透传，部署门禁断言该行存在）。
#      - s2s.secrets.jwt-secret（[122] KTD10）——JWT HS256 签名密钥占位。刻意用裸占位
#        ＄{JWT_SECRET} 而非 ＄{JWT_SECRET:?}：s2s.secrets.* 走 @ConfigurationProperties
#        非严格解析，:? 形态未注入时会绑成默认值 "?"（见文件头注释 1 的 datasource 实测），
#        守卫识别不了该形态；裸占位未注入时绑 "${JWT_SECRET}" 字面量，被 SecretsProperties
#        的 requireResolved 直接拦截并点名变量（快速失败闸门在守卫，同其余六项范式）。
#        长度 ≥32 字节的强度守卫同在 SecretsProperties（KTD10）。
# ─────────────────────────────────────────────────────────────────

server:
  # [122] KTD2：framework 策略使 X-Forwarded-For 参与 request.getRemoteAddr() 解析
  # （IP 维限频三轨取真实客户端 IP；无代理头时回退 remoteAddr，本地直连不受影响）
  forward-headers-strategy: framework
  error:
    # 响应体永不携带堆栈（编码规范 §4.3「日志打全栈、响应体无堆栈」+ 详设 §2.2）：
    # GlobalExceptionHandler 已保证业务异常路径无堆栈，本项兜住容器/BasicErrorController
    # 直接渲染的 /error 路径（如 404、过滤器链内抛出的未映射异常），属双保险
    include-stacktrace: never

spring:
  application:
    # 服务名：与 deploy/compose 服务名及应用日志标识一致（编码规范 §4.1 单体单进程单模块）
    name: s2s-server

  # --- 业务库数据源（KTD-7：@Primary 消费方；埋点库数据源见 config/FlywayTrackConfig）---
  datasource:
    url: ${SPRING_DATASOURCE_URL:?}
    username: ${SPRING_DATASOURCE_USERNAME:?}
    password: ${SPRING_DATASOURCE_PASSWORD:?}

  # --- 业务库 Flyway（编码规范 §4.9：schema 唯一管理者；埋点库迁移由 FlywayTrackConfig 承担）---
  flyway:
    enabled: true
    locations: classpath:db/migration

  # --- Redis（技术栈 §6：会话/Token/幂等键/限频计数载体，显式 TTL、不当唯一存储）---
  data:
    redis:
      # host/port 非密钥：带本地开发默认值；compose 侧以 SPRING_DATA_REDIS_HOST=redis 等覆盖
      host: ${SPRING_DATA_REDIS_HOST:127.0.0.1}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      # 口令属六类凭证（编码规范 §3.3）：无默认值硬占位，未注入时绑定即抛
      # "Could not resolve placeholder 'SPRING_DATA_REDIS_PASSWORD'"，报错点名变量；
      # Redis 必 requirepass（编码规范 §3.3），故不提供空口令默认值
      password: ${SPRING_DATA_REDIS_PASSWORD}
      # [122] review #2 修复：命令超时与连接超时显式收敛（默认 60s 会让 Redis 黑洞时
      # 鉴权黑名单读/幂等 SETNX/限频 Lua 阻塞请求线程到 60s，耗尽 Tomcat 线程池级联）。
      # 2s 足够覆盖本机/容器内网 Redis 正常往返，Redis 不可达时快速失败
      # （鉴权黑名单读故障→50001，限频写失败→WARN 放行，幂等→50001，KTD7）。
      timeout: 2s
      connect-timeout: 2s

# --- MyBatis-Plus 持久层（[123] U2；编码规范 §4.9「简单 CRUD 用 MyBatis-Plus，性能语句 XML + EXPLAIN」）---
mybatis-plus:
  global-config:
    db-config:
      # 主键策略：数据库 AUTO_INCREMENT 自增（V1__init_schema.sql 三表 id 均 AUTO_INCREMENT）。
      # MyBatis-Plus 默认雪花 ID（ASSIGN_ID）会在 insert 时生成新 id 覆盖数据库自增，
      # 故必须显式 AUTO；与各 entity 的 @TableId(type = IdType.AUTO) 双保险一致
      id-type: auto
  configuration:
    # 下划线列名 → 驼峰字段自动映射（phone_mask → phoneMask）。MyBatis-Plus 默认已开启，
    # 此处显式写出以固化口径、防误关（entity 因此无需逐字段 @TableField 声明列名）
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        # 仅暴露 health：compose healthcheck 与 caddy depends_on: service_healthy 依赖
        # /actuator/health（部署架构设计文档）；其余端点默认不暴露以收敛攻击面（安全 §10）
        include: health

# --- 六类凭证硬占位（编码规范 §3.3；安全 §4）-----------------------------------
# 全部无默认值。快速失败闸门在 SecretsProperties 紧凑构造器守卫（@ConfigurationProperties
# 绑定对未解析占位不抛异常、只留字面量，故必须有显式守卫，见该类 Javadoc）。
# 值一律 String：Batch1 只完成「绑定 + 非空/已解析校验」，JSON 内容解析随条目[124] crypto 组件落地。
s2s:
  secrets:
    # ① DB 口令：与 spring.datasource.password 同一变量二次引用（双保险，理由见文件头注释 1）
    db-password: ${SPRING_DATASOURCE_PASSWORD}
    # ② Redis 口令：与 spring.data.redis.password 同一变量二次引用（同上）
    redis-password: ${SPRING_DATA_REDIS_PASSWORD}
    # ③ HMAC pepper 列表（盲索引 xxx_hash 的 HMAC-SHA256 密钥，安全 §4；按 key_version 列表结构）
    hmac-peppers-json: ${HMAC_PEPPERS_JSON}
    # ④ AEAD 主密钥列表（AES-GCM-256 加解密原语密钥，安全 §4；按 key_version 列表结构）
    aead-master-keys-json: ${AEAD_MASTER_KEYS_JSON}
    # ⑤ 阿里云 OSS AccessKey 对（媒体文件对象存储凭证，编码规范 §3.3 六类凭证之五）
    oss-access-key-id: ${OSS_ACCESS_KEY_ID}
    oss-access-key-secret: ${OSS_ACCESS_KEY_SECRET}
    # ⑥a 短信服务 Key（登录验证码渠道凭证，编码规范 §3.3 六类凭证之六）
    sms-key: ${SMS_KEY}
    # ⑥b 高德地图 Key（逆地理/POI 服务凭证，编码规范 §3.3 六类凭证之六）
    amap-key: ${AMAP_KEY}
    # ⑥c 微信开放平台移动应用凭据（B2-6a 微信登录 code→openid 交换）。
    # 可选绑定：资质审批中，未注入时 SecretsProperties 归一为 null，WechatCodeVerifier
    # fail-closed 抛 50001（不发起微信请求）。AppSecret 仅存服务端，禁入库/入日志/回传客户端。
    wechat-app-id: ${WECHAT_APP_ID}
    wechat-app-secret: ${WECHAT_APP_SECRET}
    # ⑦ JWT HS256 签名密钥（[122] KTD10；登录态 Token 签发/验签，第七个硬必填凭证）。
    # 裸占位（非 :? 形态）的理由见文件头注释 6：快速失败闸门在 SecretsProperties 守卫
    # （已解析 + ≥32 字节双校验），与其余硬依赖同构；例值生成 openssl rand -hex 32
    jwt-secret: ${JWT_SECRET}
  # --- OSS 媒体直传（[125] KTD2）---
  oss:
    # 直传开关：true = dev 桩（默认，真桶未就绪兜底），false = 真阿里云 SDK
    mock: ${OSS_MOCK:true}
    # 真 SDK 路径的 endpoint/bucket（mock=false 时必填；dev 桩不消费）
    # ⚠ bucket 的变量名是 OSS_BUCKET_NAME（不是 OSS_BUCKET）：部署侧
    #   deploy/env/.env.<env>（env_file 全量注入）、backup-mysql.sh、deploy-first.sh
    #   与手册 §4 均用 OSS_BUCKET_NAME。原写 OSS_BUCKET 使线上 bucket 恒为空
    #   （容器里只有 OSS_BUCKET_NAME），2026-10-14 修正。
    endpoint: ${OSS_ENDPOINT:}
    bucket: ${OSS_BUCKET_NAME:}
  # --- 实名核验（阿里云信息核验 Id2MetaVerify）---
  # dry-run=true 时只按「身份证末 4 位 0000」判定（无 AK 阶段跑通全链）；
  # false 时调阿里云真实核验，AK 未配置会在启动期快速失败（不带空凭据上线）。
  cert:
    provider:
      dry-run: ${CERT_PROVIDER_DRY_RUN:true}
      endpoint: ${CLOUDAUTH_ENDPOINT:https://cloudauth.cn-beijing.aliyuncs.com}
      access-key-id: ${CLOUDAUTH_ACCESS_KEY_ID:}
      access-key-secret: ${CLOUDAUTH_ACCESS_KEY_SECRET:}
  # --- AI 智能发布（B2-4 阶段①：通义千问 / 阿里云百炼 OpenAI 兼容）---
  ai:
    # API Key（凭证族；dry-run 阶段可空）。真实通道（s2s.ai.dry-run=false）必填，
    # 缺失即每次请求抛 IllegalStateException → 50301（刻意不回退 dry-run，避免静默降级）。
    # 变量名取官方口径 DASHSCOPE_API_KEY；【带空默认值】占位，故不匹配 .env.example 双向核对
    # 正则（同 OSS_ENDPOINT/OSS_BUCKET_NAME），本机/dev 在 dry-run 下无需该变量。
    # ⚠ 生效方式：本键从环境变量取，容器创建时注入（改 .env.<env> 后须重建容器，非 docker restart）。
    api-key: ${DASHSCOPE_API_KEY:}
    # 文本模型名（Step 1）。默认 qwen-plus；scope 含 media 图或 ASR 转写时切下方 omni-model。
    model: ${AI_MODEL:qwen-plus}
    # 多模态模型名（Step 2：图片入参 + ASR 转写）。官方现行文本分析档 qwen3.8-omni-flash
    # （2026-10-15 文档口径；任务书原拟 qwen-omni-turbo 已换代）。图/音以 OSS 只读签名 URL 入参。
    omni-model: ${AI_OMNI_MODEL:qwen3.8-omni-flash}
    # 上游 base URL（百炼 OpenAI 兼容，华北2·北京）。官方文档明确「Key 与 endpoint 必须同地域」，
    # 换地域须同时换 Key；建议域名可换为业务空间专属域名（{WorkspaceId}.cn-beijing.maas.aliyuncs.com）。
    endpoint: ${AI_ENDPOINT:https://dashscope.aliyuncs.com/compatible-mode/v1}
  # --- 登录短信验证码（[123]；2026-10-14 裁定加内测白名单闸）---
  sms:
    # 内测可登录手机号白名单（逗号分隔）。**留空 = 不启用（dev/staging 全放行）**。
    # prod 的真实名单【直写】在 deploy/config/app/application-prod.yml —— 该文件由 compose
    # 按环境挂载（./config/app → /opt/s2s/config），改完重启容器生效，无需重新出镜像。
    # 2026-10-14 裁定：不走环境变量，少一处配置。
    whitelist: ""
  # --- S1 双向推送（B2-2 阶段 2：厂商真实通道）---
  # 两家均为「启用了就必须有凭据」：enabled=true 而凭据为空时 Sender 构造期直接失败，
  # 不给静默降级留口子；enabled=false（默认）时对应 Sender 不注册，下发走站内兜底。
  # 凭据属服务端密钥：只经 deploy/env/.env.<env> 注入，禁入仓库、禁入镜像。
  push:
    huawei:
      # 华为 Push Kit（v1 REST：AppID + AppSecret 换 OAuth2 Token）
      enabled: ${HUAWEI_PUSH_ENABLED:false}
      app-id: ${HUAWEI_PUSH_APP_ID:}
      app-secret: ${HUAWEI_PUSH_APP_SECRET:}
    xiaomi:
      # 小米推送（v3 REST：AppSecret 作 Authorization；AppId/AppKey 属客户端）
      enabled: ${XIAOMI_PUSH_ENABLED:false}
      app-secret: ${XIAOMI_PUSH_APP_SECRET:}
      # 包名须与小米推送后台登记一致（当前沿用开发期包名，换正式包名须同步重登）
      package-name: ${XIAOMI_PUSH_PACKAGE_NAME:com.s2s.zhaoyazhao.dev}
      # 私信消息必填项（2026-12-31 前须完成模板接入）：channel 与模板均在小米运营平台申请。
      # 未配置时按普通通道下发（可用于联调/公信消息），配置后自动附带三者。
      channel-id: ${XIAOMI_PUSH_CHANNEL_ID:}
      template-id: ${XIAOMI_PUSH_TEMPLATE_ID:}
      # 模板变量 JSON（须与模板预配置变量一致；无变量模板留空 = 传 {}）
      template-param: ${XIAOMI_PUSH_TEMPLATE_PARAM:}
  # --- 可观测性定时任务的输入路径（[148]）---
  observability:
    # 定时任务 #8 的 T3 判据要读的主看板 SQL 清单路径（《可观测性架构方案》§9.1.1）。
    # 默认值 = 运行镜像内路径（deploy/Dockerfile 把 docs/architecture/dashboard_queries.sql
    # 拷到 WORKDIR /opt/s2s 下的 observability/ 目录）；本机直跑时该文件通常不存在
    # → T3 如实记 SKIP（SKIP 不是 PASS）。本机需验证时可用
    # DASHBOARD_SQL_PATH=docs/architecture/dashboard_queries.sql 覆盖。
    # 带默认值占位不匹配 .env.example 双向核对正则，故不进该模板（非密钥本地默认路径）。
    dashboard-sql-path: ${DASHBOARD_SQL_PATH:/opt/s2s/observability/dashboard_queries.sql}
