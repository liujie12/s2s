# ─────────────────────────────────────────────────────────────────
# 找鸭找（s2s）后端 · 最小占位配置（条目[121] U-1 建立，U-5 将按编码规范 §3.3 全面改写）
#
# 当前仅为工程骨架占位，明确两件事：
#   1. 数据源（业务库 s2s / 埋点库 s2s_track）与 Redis 在 U-5 才配置——
#      届时 jar 内 yml 只允许 ${VAR:?} 占位、缺变量启动快速失败（编码规范 §3.3；R-6）。
#      因此 U-1 阶段应用尚不能启动（Flyway 在 classpath 且无可达数据库时启动失败），
#      本单元验收仅要求 mvn compile / mvn test 通过。
#   2. KTD-3：Java 21 不开虚拟线程，故全文件不出现 spring.threads.virtual.enabled
#     （退出条件：Java 24 或压测证明 I/O 阻塞）。
# ─────────────────────────────────────────────────────────────────

spring:
  application:
    # 服务名：与 deploy/compose 服务名及应用日志标识一致（编码规范 §4.1 单体单进程单模块）
    name: s2s-server

management:
  endpoints:
    web:
      exposure:
        # 仅暴露 health：compose healthcheck 与 caddy depends_on: service_healthy 依赖
        # /actuator/health（部署架构设计文档）；其余端点默认不暴露以收敛攻击面（安全 §10）
        include: health
